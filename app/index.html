<script>try{var t=localStorage.getItem('td.app.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* p2, temperature 7: "the matrix as a map". Tokens copied by name and value from Views/TasksDashboard/TasksDashboard.html :root.
   Added only: --field / --field-on (quadrant fields deepened in light mode so white text passes 4.5:1). */
:root{
  color-scheme:light;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ui:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Sitka Display","Sitka Heading","Sitka","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --s1:2px;--s2:4px;--s3:8px;--s4:12px;--s5:16px;--s6:24px;--s7:32px;
  --r-sm:8px;--r:10px;--r-lg:14px;--r-xl:22px;
  --blur:blur(26px) saturate(170%);
  --bg:#EEEDF8;
  --au1:rgba(129,140,248,.55);--au2:rgba(192,132,252,.45);--au3:rgba(56,189,248,.34);--au4:rgba(165,180,252,.5);
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--glass3:rgba(255,255,255,.9);--solid:#FCFCFF;
  --rim:rgba(255,255,255,.85);--hair:rgba(40,36,92,.10);--hair2:rgba(40,36,92,.18);
  --depth:0 1px 0 rgba(255,255,255,.9) inset,0 22px 48px -26px rgba(49,46,129,.38),0 2px 8px -2px rgba(49,46,129,.08);
  --lift:0 1px 0 rgba(255,255,255,.9) inset,0 14px 30px -16px rgba(49,46,129,.35);
  --ink:#16142E;--ink2:#3A3858;--ink3:#64628A;
  --hover:rgba(99,91,255,.07);--well:rgba(40,36,92,.05);
  --accent:#5B4CF0;--accent2:#8B3DFF;--accent-ink:#4A3AD8;--on-accent:#FFFFFF;--accent-bg:rgba(91,76,240,.10);--accent-line:rgba(91,76,240,.32);--glow:rgba(110,86,255,.38);
  --danger:#E5484D;--danger-ink:#C62A31;--danger-bg:rgba(229,72,77,.08);--on-danger:#FFFFFF;
  --focus:#6E56FF;
  --qa:#E5484D;--qa-on:#FFFFFF;
  --qb:#14A35A;--qb-on:#FFFFFF;
  --qc:#F2B500;--qc-on:#2E2200;
  --qd:#6B7491;--qd-on:#FFFFFF;
  --fa:#B83A3E;--fb:#0E7A43;--fc:#F2B500;--fd:#575F7A;
  --fa-on:#FFFFFF;--fb-on:#FFFFFF;--fc-on:#2E2200;--fd-on:#FFFFFF;
  --toast-bg:rgba(22,20,46,.92);--toast-ink:#FFFFFF;
  --on-fill:#FFFFFF;
  --tab-h:64px;--add-h:56px;
  --week:#C2410C;--lk-par:var(--accent-ink);--lk-sub:#0E7490;--lk-prev:#C2410C;--lk-next:#1D4ED8;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070814;
  --au1:rgba(79,70,229,.55);--au2:rgba(147,51,234,.42);--au3:rgba(14,116,190,.38);--au4:rgba(67,56,202,.35);
  --glass:rgba(18,18,44,.42);--glass2:rgba(26,26,56,.78);--glass3:rgba(30,30,62,.92);--solid:#17173A;
  --rim:rgba(255,255,255,.09);--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.16);
  --depth:0 1px 0 rgba(255,255,255,.07) inset,0 26px 60px -28px rgba(0,0,0,.85),0 2px 10px -2px rgba(0,0,0,.4);
  --lift:0 1px 0 rgba(255,255,255,.08) inset,0 16px 34px -16px rgba(0,0,0,.8);
  --ink:#EEEDFF;--ink2:#C6C4E6;--ink3:#9A98C2;
  --hover:rgba(160,150,255,.09);--well:rgba(255,255,255,.04);
  --accent:#8C7BFF;--accent2:#B46BFF;--accent-ink:#B9AEFF;--on-accent:#FFFFFF;--accent-bg:rgba(140,123,255,.16);--accent-line:rgba(140,123,255,.45);--glow:rgba(140,110,255,.55);
  --danger:#FF6369;--danger-ink:#FF8A8F;--danger-bg:rgba(255,99,105,.10);--on-danger:#1B0507;
  --focus:#A898FF;
  --qa:#FF6369;--qa-on:#2A0507;--qb:#3DD68C;--qb-on:#04210F;--qc:#FFD84D;--qc-on:#2B2000;--qd:#A3AAC6;--qd-on:#12142A;
  --fa:#FF6369;--fb:#3DD68C;--fc:#FFD84D;--fd:#A3AAC6;--fa-on:#2A0507;--fb-on:#04210F;--fc-on:#2B2000;--fd-on:#12142A;
  --toast-bg:rgba(238,237,255,.95);--toast-ink:#16142E;
  --on-fill:#14112E;
  --week:#FB923C;--lk-par:var(--accent-ink);--lk-sub:#22D3EE;--lk-prev:#FB923C;--lk-next:#60A5FA;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#070814;
  --au1:rgba(79,70,229,.55);--au2:rgba(147,51,234,.42);--au3:rgba(14,116,190,.38);--au4:rgba(67,56,202,.35);
  --glass:rgba(18,18,44,.42);--glass2:rgba(26,26,56,.78);--glass3:rgba(30,30,62,.92);--solid:#17173A;
  --rim:rgba(255,255,255,.09);--hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.16);
  --depth:0 1px 0 rgba(255,255,255,.07) inset,0 26px 60px -28px rgba(0,0,0,.85),0 2px 10px -2px rgba(0,0,0,.4);
  --lift:0 1px 0 rgba(255,255,255,.08) inset,0 16px 34px -16px rgba(0,0,0,.8);
  --ink:#EEEDFF;--ink2:#C6C4E6;--ink3:#9A98C2;
  --hover:rgba(160,150,255,.09);--well:rgba(255,255,255,.04);
  --accent:#8C7BFF;--accent2:#B46BFF;--accent-ink:#B9AEFF;--on-accent:#FFFFFF;--accent-bg:rgba(140,123,255,.16);--accent-line:rgba(140,123,255,.45);--glow:rgba(140,110,255,.55);
  --danger:#FF6369;--danger-ink:#FF8A8F;--danger-bg:rgba(255,99,105,.10);--on-danger:#1B0507;
  --focus:#A898FF;
  --qa:#FF6369;--qa-on:#2A0507;--qb:#3DD68C;--qb-on:#04210F;--qc:#FFD84D;--qc-on:#2B2000;--qd:#A3AAC6;--qd-on:#12142A;
  --fa:#FF6369;--fb:#3DD68C;--fc:#FFD84D;--fd:#A3AAC6;--fa-on:#2A0507;--fb-on:#04210F;--fc-on:#2B2000;--fd-on:#12142A;
  --toast-bg:rgba(238,237,255,.95);--toast-ink:#16142E;
  --on-fill:#14112E;
  --week:#FB923C;--lk-par:var(--accent-ink);--lk-sub:#22D3EE;--lk-prev:#FB923C;--lk-next:#60A5FA;
}}
[data-q="A"]{--c:var(--qa);--c-on:var(--qa-on);--f:var(--fa);--f-on:var(--fa-on)}
[data-q="B"]{--c:var(--qb);--c-on:var(--qb-on);--f:var(--fb);--f-on:var(--fb-on)}
[data-q="C"]{--c:var(--qc);--c-on:var(--qc-on);--f:var(--fc);--f-on:var(--fc-on)}
[data-q="D"]{--c:var(--qd);--c-on:var(--qd-on);--f:var(--fd);--f-on:var(--fd-on)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100dvh;background:transparent;color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ground: the app's aurora, plus a wash in the colour of the quadrant on screen */
.aura{position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(90vmax 60vmax at 10% 8%,var(--au1),transparent 60%),
  radial-gradient(70vmax 50vmax at 95% 18%,var(--au2),transparent 60%),
  radial-gradient(80vmax 60vmax at 80% 100%,var(--au3),transparent 62%),
  radial-gradient(70vmax 60vmax at 0% 100%,var(--au4),transparent 60%),var(--bg)}
.wash{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s ease;background:radial-gradient(120vw 60vh at 50% 18%,color-mix(in oklab,var(--c) 26%,transparent),transparent 70%)}
.wash.on{opacity:1}

/* top bar: status only */
.top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 8px) calc(16px + var(--sar)) 0 calc(16px + var(--sal));background:color-mix(in oklab,var(--bg) 72%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--hair)}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.mark{width:28px;height:28px;flex:none}
.top h1{margin:0;font:600 19px/1 var(--ui);letter-spacing:-.01em;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair2);background:var(--glass2);color:var(--ink2);font:500 13px/1 var(--ui);max-width:62vw}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--qb);flex:none}
.pill[data-s="saving"] .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.pill[data-s="offline"]{color:var(--ink);border-color:var(--qc)}.pill[data-s="offline"] .dot{background:var(--qc)}
.pill[data-s="conflict"],.pill[data-s="session"]{color:var(--danger-ink);border-color:var(--danger)}.pill[data-s="conflict"] .dot,.pill[data-s="session"] .dot{background:var(--danger)}
.pill[data-s="busy"]{color:var(--ink);border-color:var(--qc)}.pill[data-s="busy"] .dot{background:var(--qc);animation:pulse 1s ease-in-out infinite}
.pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;padding:1px 0}
.pill .spin{display:none;width:16px;height:16px;flex:none;color:var(--accent-ink);animation:spin .9s linear infinite}
.pill[data-s="sync"] .spin{display:block}
.pill[data-s="sync"] .dot{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}

/* list chips */
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px}
/* Improvement 3 (U19): horizontal chip rows fade on the side that has more to scroll. A mask, not an overlay, so light and dark
   both work; .fade-start / .fade-end are set by fadeRow() from the scroll position. The end padding lets the last chip clear the fade,
   scroll-padding keeps a focused chip out of the 32 px fade zone. No scroll snap: proximity snap pulled a focused chip back under the fade. */
.chiprow,.weeks{padding-inline-end:28px;scroll-padding-inline:32px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.chiprow.fade-end,.weeks.fade-end{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
.chiprow.fade-start,.weeks.fade-start{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 32px),transparent)}
.chiprow.fade-start.fade-end,.weeks.fade-start.fade-end{-webkit-mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,transparent,#000 32px,#000 calc(100% - 32px),transparent)}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair2);background:var(--glass2);color:var(--ink);font:500 14px/1 var(--ui);white-space:nowrap;scroll-snap-align:start}
.chip .n{color:var(--ink3);font-weight:500}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n,.chip[aria-current="true"] .n{color:inherit;opacity:.75}
.chip .od{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--fa);color:var(--fa-on);font:600 12px/20px var(--ui);text-align:center}
.chip:active{transform:scale(.97)}
.chip.ghost{border-style:dashed;background:transparent}
.chip svg.i{width:18px;height:18px}

main{padding:0 calc(16px + var(--sar)) calc(var(--tab-h) + 88px + var(--sab)) calc(16px + var(--sal))}
body.toasting main{padding-bottom:calc(var(--tab-h) + 200px + var(--sab))}
.view{animation:viewin .28s ease both}
@keyframes viewin{from{opacity:0}to{opacity:1}}

/* the map: the hero. Plan | Do over Eliminate | Delegate, as on the web board. The chosen quadrant takes the larger cell. */
.map{--big:minmax(min-content,1.45fr);--small:minmax(min-content,1fr);display:grid;gap:8px;height:clamp(196px,29dvh,236px);margin-top:14px;grid-template-areas:"B A" "D C";grid-template-columns:1fr 1.5fr;grid-template-rows:var(--big) var(--small)}
.map[data-sel="B"]{grid-template-columns:1.5fr 1fr;grid-template-rows:var(--big) var(--small)}
.map[data-sel="D"]{grid-template-columns:1.5fr 1fr;grid-template-rows:var(--small) var(--big)}
.map[data-sel="C"]{grid-template-columns:1fr 1.5fr;grid-template-rows:var(--small) var(--big)}
.tile{grid-area:var(--a);position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:64px;padding:10px 12px;border-radius:var(--r-lg);border:1px solid var(--hair2);background:var(--glass2);color:var(--ink);overflow:hidden;box-shadow:var(--lift)}
.tile[data-q="A"]{--a:A}.tile[data-q="B"]{--a:B}.tile[data-q="C"]{--a:C}.tile[data-q="D"]{--a:D}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .verb{font:500 21px/1 var(--serif);letter-spacing:-.01em}
.tile .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;width:100%}
.tile .sub{display:flex;flex-direction:column;gap:6px;min-width:0;padding-bottom:2px}
.tile .hl{display:flex;align-items:flex-start;gap:8px}
.lt{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--f);color:var(--f-on);font:700 12px/1 var(--ui)}
.tile[aria-pressed="true"] .lt{background:var(--f-on);color:var(--f)}
.tile .cnt{font:400 34px/.8 var(--serif);font-variant-numeric:lining-nums tabular-nums;flex:none}
.tile .od{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--ui);color:var(--danger-ink);white-space:nowrap}
.tile .od::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--glass3)}
.tile .hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tile[aria-pressed="true"]{background:var(--f);color:var(--f-on);border-color:transparent;box-shadow:0 18px 40px -18px var(--c),0 1px 0 rgba(255,255,255,.25) inset}
.tile[aria-pressed="true"]::before{display:none}
.tile[aria-pressed="true"] .verb{font-size:clamp(34px,11vw,54px);line-height:.88;font-weight:500}
.tile[aria-pressed="true"] .cnt{font-size:clamp(50px,15vw,66px)}
.tile[aria-pressed="true"] .hint{position:static;width:auto;height:auto;overflow:visible;clip-path:none;white-space:normal;display:block;font:500 13px/1.25 var(--ui)}
.tile[aria-pressed="true"] .od{color:var(--f-on)}
.tile[aria-pressed="true"] .od::before{background:var(--f-on);box-shadow:none}
.tile[aria-pressed="true"] .in{animation:tilein .32s cubic-bezier(.2,.8,.2,1) both}
.tile .in{display:flex;flex-direction:column;justify-content:space-between;height:100%;width:100%}
.tile.over .cnt::after{content:" over";font:600 12px/1 var(--ui);vertical-align:middle}
@keyframes tilein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tile:active{transform:scale(.97)}
.map.loading .cnt{min-height:34px;background:linear-gradient(90deg,var(--well),var(--hair2),var(--well));border-radius:6px;min-width:36px}

/* quadrant panels */
.board{margin-top:16px}
.quad{display:none}
.quad.on{display:block}
.qhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:44px;padding:4px 0 10px;touch-action:pan-y}
.qhead .qline{margin:0;font:500 14px/1.35 var(--ui);color:var(--ink2)}
.qhead .qline b{color:var(--ink);font-weight:600}
.qhead .qtitle{display:none}
.qhead .qadd{display:none}
.hintbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 6px 6px 14px;border-radius:var(--r);background:var(--glass2);border:1px solid var(--hair);font:500 13px/1.35 var(--ui);color:var(--ink2)}
.hintbar p{margin:0;flex:1}
.banner{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:12px 14px;border-radius:var(--r);background:var(--accent-bg);border:1px solid var(--accent-line);font:500 14px/1.4 var(--ui);color:var(--ink)}
.banner svg.i{width:20px;height:20px;margin-top:1px}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{position:relative;border-radius:var(--r-lg);touch-action:pan-y}
.swbg{position:absolute;inset:0;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:600 15px/1 var(--ui);opacity:0}
.swbg .l{color:var(--fb-on)}.swbg .r{color:var(--on-fill)}
.card.sw-r .swbg{opacity:1;background:var(--fb)}
.card.sw-l .swbg{opacity:1;background:var(--accent);justify-content:flex-end}
.card.sw-r .swbg .r,.card.sw-l .swbg .l{display:none}
.cin{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"chk main more" "grip meta chev" "x extra extra";column-gap:6px;padding:6px 6px 6px 4px;border-radius:var(--r-lg);background:var(--glass3);border:1px solid var(--hair);box-shadow:var(--lift);will-change:transform}
.cin::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.card.snap .cin{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.card.dragging{z-index:5}
.card.dragging .cin{box-shadow:var(--depth);outline:2px solid var(--accent-line)}
.card.leaving{animation:leave .24s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(30%)}}
.card.enter{animation:enter .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:var(--r);background:transparent;color:var(--ink2)}
.ib:active{background:var(--hover);transform:scale(.94)}
.chk{grid-area:chk}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink3);display:grid;place-items:center;background:var(--solid)}
.chk .box svg{width:16px;height:16px;opacity:0;stroke:var(--fb-on);stroke-width:2.6}
.chk[aria-checked="true"] .box{background:var(--fb);border-color:var(--fb)}
.chk[aria-checked="true"] .box svg{opacity:1}
.cmain{grid-area:main;display:flex;align-items:baseline;gap:8px;min-height:44px;padding:11px 2px 4px;border:0;background:transparent;text-align:left;color:var(--ink);min-width:0}
.cmain .num{font:500 15px/1 var(--serif);color:var(--ink3);flex:none}
.cmain .ttl{font:600 16px/1.3 var(--ui);overflow-wrap:anywhere}
.more{grid-area:more}.grip{grid-area:grip;touch-action:none;color:var(--ink3)}.chev{grid-area:chev}
.chev svg{transition:transform .2s ease}.chev[aria-expanded="true"] svg{transform:rotate(180deg)}
.meta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:44px;padding:0 2px}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font:500 12px/1.2 var(--ui);background:var(--well);color:var(--ink2);border:1px solid var(--hair)}
.badge.overdue{background:var(--danger-bg);color:var(--danger-ink);border-color:color-mix(in oklab,var(--danger) 40%,transparent);font-weight:600}
.badge.soon{background:color-mix(in oklab,var(--qc) 22%,transparent);color:var(--ink);border-color:color-mix(in oklab,var(--qc) 55%,transparent)}
.badge.tag{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-line)}
.badge.q{background:var(--f);color:var(--f-on);border:0}
.extra{grid-area:extra;padding:0 6px 8px 2px;font:400 14px/1.5 var(--font);color:var(--ink2)}
.extra p,.extra .d{margin:0 0 8px}
.extra .tags{display:flex;flex-wrap:wrap;gap:6px}
.card.readonly .chk,.card.readonly .grip{visibility:hidden}
.empty{padding:28px 18px;border-radius:var(--r-lg);border:1.5px dashed var(--hair2);text-align:left}
.empty p{margin:0 0 14px;font:500 22px/1.25 var(--serif);color:var(--ink)}
.skel{height:96px;border-radius:var(--r-lg);background:linear-gradient(100deg,var(--glass2) 30%,var(--glass3) 50%,var(--glass2) 70%);background-size:300% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--hair2);background:var(--glass3);color:var(--ink);font:600 15px/1 var(--ui)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-fill);box-shadow:0 12px 24px -12px var(--glow)}
.btn.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.danger{color:var(--danger-ink);border-color:color-mix(in oklab,var(--danger) 45%,transparent);background:transparent}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.block{width:100%}

/* Add: thumb zone, right hand, above the tab bar */
/* Add sits in the tab bar's centre slot: in the thumb zone, never over a card */
.fab{align-self:center;justify-self:center;height:48px;min-width:84px;margin:0 6px;padding:0 16px 0 12px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-fill);font:700 16px/1 var(--ui);box-shadow:0 10px 22px -12px var(--glow)}
.fab:active{transform:scale(.96)}
.fab svg.i{width:22px;height:22px;stroke-width:2.4}

.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;padding:0 var(--sar) var(--sab) var(--sal);height:calc(var(--tab-h) + var(--sab));background:color-mix(in oklab,var(--bg) 78%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--hair)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--ink2);font:500 12px/1 var(--ui);min-height:var(--tab-h);position:relative}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge-n{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-fill);font:700 12px/18px var(--ui);text-align:center;padding:0 4px}

.toast{position:fixed;z-index:40;left:calc(16px + var(--sal));right:calc(72px + var(--sar));bottom:calc(var(--tab-h) + 16px + var(--sab));max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 6px 4px 18px;border-radius:16px;background:var(--toast-bg);color:var(--toast-ink);font:500 15px/1.3 var(--ui);box-shadow:0 18px 40px -16px rgba(0,0,0,.5);transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
.toast.show{transform:none;opacity:1}
.toast.show button{pointer-events:auto} /* only Undo takes taps; the message lets taps through to what is under it */
.toast p{margin:0;flex:1}
.toast button{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:transparent;color:inherit;font:700 15px/1 var(--ui);text-decoration:underline;text-underline-offset:3px}
dialog .toast{position:fixed;bottom:calc(var(--kb,0px) + 88px + var(--sab))}

/* sheets */
dialog{color:var(--ink);font:inherit}
dialog::backdrop{background:rgba(12,10,32,.42)}
/* R4b: the sheet fits the visible viewport above the keyboard (--vvh, --kb from visualViewport); only its body scrolls */
dialog.sheet{position:fixed;inset:auto 0 var(--kb,0px) 0;margin:0 auto;width:100%;max-width:620px;max-height:min(92dvh,calc(var(--vvh,100dvh) - 12px));display:flex;flex-direction:column;padding:0;border:0;border-radius:var(--r-xl) var(--r-xl) 0 0;background:var(--solid);box-shadow:var(--depth);overflow:hidden;overscroll-behavior:contain}
dialog.sheet:not([open]){display:none}
dialog.sheet[open]{animation:sheetin .3s cubic-bezier(.2,.8,.2,1)}
dialog.sheet>form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
dialog.sheet,dialog.sheet>form{overflow:clip} /* nothing but the body scrolls, not even scrollIntoView */
dialog.sheet .sbody,#menu-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog.sheet .shead,dialog.sheet .sfoot,dialog.sheet .grabzone{flex:none}
dialog.sheet .shead{touch-action:none}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
dialog.full{height:calc(var(--vvh,100dvh) - var(--vvt,0px));max-height:none;border-radius:0;padding-top:var(--sat)}
dialog.alert{border:0;border-radius:var(--r-xl);padding:22px;max-width:340px;width:calc(100% - 32px);background:var(--solid);box-shadow:var(--depth)}
dialog.alert h2{margin:0 0 8px;font:500 26px/1.15 var(--serif)}
dialog.alert p{margin:0 0 18px;color:var(--ink2)}
.alert .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair2);margin:8px auto 0;touch-action:none}
.grabzone{display:grid;place-items:start center;width:100%;height:44px;border:0;background:transparent;padding:0;touch-action:none}
.shead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 20px;background:var(--solid)}
.shead h2{flex:1;margin:0;font:500 28px/1.1 var(--serif);letter-spacing:-.01em}
.sbody{padding:4px 20px calc(16px + var(--sab))}
.sbody:has(+.sfoot){padding-bottom:8px}
.sfoot{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;padding:12px 20px calc(12px + var(--sab));background:var(--solid);border-top:1px solid var(--hair)}
.sfoot .btn{flex:1}
.status-line{min-height:22px;margin:0 0 6px;font:600 14px/1.4 var(--ui);color:var(--fb)}
:root[data-theme="dark"] .status-line{color:var(--qb)}
.title-in{width:100%;min-height:56px;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--hair2);background:var(--bg);font:500 20px/1.3 var(--ui);color:var(--ink)}
.title-in:focus{border-color:var(--accent);outline:2px solid var(--accent-line);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.qchip[data-q]{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;padding:10px;border-radius:var(--r-lg);background:var(--well)}
.opts .chip{background:var(--solid)}
.opts .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts input[type=date]{min-height:44px;padding:0 10px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--solid)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"B A" "D C";gap:10px}
.qbtn{grid-area:var(--a);min-height:96px;border-radius:var(--r-lg);border:0;background:var(--f);color:var(--f-on);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px 14px;text-align:left}
.qbtn[data-q="A"]{--a:A}.qbtn[data-q="B"]{--a:B}.qbtn[data-q="C"]{--a:C}.qbtn[data-q="D"]{--a:D}
.qbtn b{font:500 30px/1 var(--serif)}
.qbtn span{font:500 13px/1.25 var(--ui);opacity:.92}
.qbtn[aria-current="true"]{outline:3px solid var(--ink);outline-offset:2px}
.menu{list-style:none;margin:0;padding:0 12px}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:var(--ink);font:500 16px/1.2 var(--ui);text-align:left;text-decoration:none}
.menu button:active{background:var(--hover)}
.menu button.warn{color:var(--danger-ink)}

/* forms */
.field{display:block;margin:0 0 16px}
.field>span,.flabel{display:block;margin:0 0 6px;font:600 13px/1.2 var(--ui);color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font)}
textarea.inp{min-height:110px;resize:vertical}
.rich{min-height:110px;line-height:1.5;overflow-wrap:anywhere}
.rich ul,.extra ul{margin:4px 0;padding-left:22px}
.rich:empty::before{content:attr(data-ph);color:var(--ink2)}
#t-desc:empty::before{content:"Add details"}
.descw .tb{display:none}
.descw.open .tb{display:flex}
.rich.one{min-height:48px;max-height:48px;overflow:hidden;padding-top:12px}
.descw.open .rich.one{min-height:96px;max-height:none;overflow:visible}
.descw{margin:12px 0 12px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.picked:empty{display:none}
.tgh{margin:8px 0 6px;font:600 13px/1.2 var(--ui);color:var(--ink2)}
.tagsw .inp{min-height:44px}
.tgrp{margin:8px 0 0}
.tgh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--ink);font:600 14px/1.2 var(--ui);text-align:left}
.tgh .tgn{flex:none}
.tgh small{flex:1;font:500 12px/1.2 var(--ui);color:var(--ink2)}
.tgh svg.i{width:18px;height:18px;margin-left:auto;transition:transform .2s}
.tgh[aria-expanded="false"] svg.i{transform:rotate(-90deg)}
.tchips{margin:2px 0 6px}
.tlg{margin:14px 0 0}
.tlg.arch .rows{border-style:dashed}
.tlhead{display:flex;align-items:flex-start;gap:8px;margin:0 0 6px 4px}
.tlhead>div{flex:1;min-width:0}
.tlhead h3{margin:0;font:500 22px/1.2 var(--serif)}
.tlhead .def{display:inline-flex;align-items:center;gap:3px;font:600 12px/1 var(--ui);color:var(--accent-ink);vertical-align:middle;margin-left:6px}
svg.star{width:14px;height:14px;flex:none;color:var(--accent-ink);vertical-align:-2px;margin-left:4px}
.tlhead .def svg.star{margin-left:0}
.tlhead p{margin:2px 0 0;font:500 13px/1.35 var(--ui);color:var(--ink2)}
.tlg .rowb{min-height:52px}
.tlg .rowb .ib{margin-right:-8px}
dialog.alert form .field{margin:0 0 6px}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent-line);outline-offset:0}
.tb{display:flex;gap:4px;margin:0 0 6px}
.tb .ib{border:1px solid var(--hair);background:var(--glass3);font:700 15px/1 var(--ui)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border:0;margin:0 0 16px;padding:0}
.seg legend{padding:0;margin:0 0 6px;font:600 13px/1.2 var(--ui);color:var(--ink2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--bg);font:600 14px/1 var(--ui);box-shadow:inset 0 -3px 0 var(--c)}
.seg input:checked+span{background:var(--f);color:var(--f-on);border-color:transparent}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{margin:0 0 16px;padding:12px 14px;border-radius:var(--r);background:var(--danger-bg);border:1px solid color-mix(in oklab,var(--danger) 45%,transparent);color:var(--ink);font:500 14px/1.45 var(--ui)}
.note .theirs{display:block;margin:8px 0;padding:8px 10px;border-radius:var(--r-sm);background:var(--solid);font-weight:400}
.err{margin:6px 0 0;color:var(--danger-ink);font:600 13px/1.35 var(--ui)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:4px 0;font:500 15px/1.3 var(--ui)}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--hair2);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--solid);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.dangerrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.src{margin:0 0 16px;font:400 14px/1.45 var(--font);color:var(--ink2)}

/* page heads (Review, Search, Me) */
.phead{padding:18px 0 6px}
.phead h2{margin:0;font:500 clamp(44px,13vw,64px)/.95 var(--serif);letter-spacing:-.02em}
.phead p{margin:8px 0 0;font:500 14px/1.4 var(--ui);color:var(--ink2)}
.sentence{margin:14px 0 18px;font:400 clamp(24px,7vw,30px)/1.2 var(--serif);color:var(--ink)}
.sentence b{font-weight:600;font-variant-numeric:lining-nums}
.kl-end,.kl-top,.kb-row p,.kc-open,.cmain .num,.rbtn .num,.stepper output,.qhead .qtitle .n,.vis-dates{font-variant-numeric:lining-nums tabular-nums}
.weeks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 6px}
.weeks::-webkit-scrollbar{display:none}
.week{flex:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:56px;min-width:92px;padding:6px 14px;border-radius:var(--r-lg);border:1px solid var(--hair2);background:var(--glass2);font:600 15px/1 var(--ui);color:var(--ink)}
.week small{font:500 12px/1 var(--ui);color:var(--ink2)}
.week[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week[aria-pressed="true"] small{color:inherit;opacity:.8}
.week:disabled{opacity:.45;cursor:not-allowed}
details.vis{margin:14px 0;border-radius:var(--r-lg);background:var(--glass3);border:1px solid var(--hair)}
details.vis summary{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;font:600 15px/1 var(--ui);list-style:none;cursor:pointer}
details.vis summary::-webkit-details-marker{display:none}
details.vis[open] summary svg{transform:rotate(180deg)}
.vis-h{margin:0;font:500 26px/1 var(--serif)}
details.vis summary svg.i{transition:transform .2s ease}
.vis-in{padding:0 14px 16px}
.vis-in .chiprow{padding-top:0}
.vis-range{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:2px 0 14px}
.segb{display:flex;gap:6px}
.segb .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vis-dates{font:500 13px/1.3 var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.kf{margin:0;min-width:0}
.kf figcaption{margin:0 0 24px;font:500 13px/1.35 var(--ui);color:var(--ink2)}
[data-q]{--c80:color-mix(in oklab,var(--c) 80%,var(--solid));--c32:color-mix(in oklab,var(--c) 32%,var(--solid))}
.kl-plot{position:relative;height:132px;padding-right:96px;border-bottom:1px solid var(--hair2)}
.kl-svg{position:absolute;left:0;top:0;width:calc(100% - 96px);height:128px;overflow:visible}
.kl-l{stroke:var(--c80)}
.kl-l:not([data-q]){stroke:var(--ink)}
.kl-top{position:absolute;left:0;top:-18px;font:500 12px/1 var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.kl-ends{position:absolute;right:0;top:0;width:90px;height:132px}
.kl-end{position:absolute;left:0;display:flex;align-items:center;gap:6px;font:500 12px/16px var(--ui);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.kl-end::before{content:"";width:10px;height:2px;background:var(--c80,var(--ink))}
.kl-end:not([data-q])::before{background:var(--ink)}
.kl-ticks{padding-right:96px;margin-top:6px;font:500 12px/1 var(--ui);color:var(--ink2)}
.kl-ticks>div{position:relative;height:14px}
.kl-ticks span{position:absolute;top:0;white-space:nowrap}
.kl{container-type:inline-size}
@container (max-width:280px){ .kl-ticks .mid{display:none} }
.k-note{margin:10px 0 0;font:500 13px/1.4 var(--ui);color:var(--ink2)}
.kb{display:grid;gap:12px}
.kb-row p{margin:0 0 5px;font:500 14px/1.3 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums}
.kb-row p b{font-weight:700}
.kb-bar{display:flex;gap:2px;height:10px}
.kb-bar i{display:block;height:100%;border-radius:3px}
.kb-bar .o{background:var(--c80)}
.kb-bar .c{background:var(--c32)}
.kc-nums{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px}
.kc-n{display:flex;align-items:baseline;gap:6px;margin:0;font:500 14px/1 var(--ui);color:var(--ink)}
.kc-n b{font:500 28px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.kc-n .sw{width:10px;height:10px;border-radius:3px;align-self:center}
.closed{--k:var(--accent)}.archived{--k:var(--ink3)}.deleted{--k:color-mix(in oklab,var(--danger) 50%,var(--solid))}
.kc-n .sw{background:var(--k)}
.kc-bar{display:flex;gap:2px;height:6px;border-radius:3px;background:var(--well);overflow:hidden}
.kc-bar i{display:block;height:100%;background:var(--k)}
.kc-open{margin:10px 0 0;font:500 14px/1.3 var(--ui);color:var(--ink2)}
.kc-open b{color:var(--ink);font-weight:700}
hr.rv-sep{border:0;border-top:1px solid var(--hair2);margin:18px 0 12px}
@media (min-width:600px){ .kpi{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px} .kl-plot{padding-right:84px} .kl-svg{width:calc(100% - 84px)} .kl-ends{width:80px} .kl-ticks{padding-right:84px} }
.grp{margin:18px 0 0}
.grp h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font:500 26px/1.1 var(--serif)}
.grp h3::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c)}
.grp h4{margin:10px 0 4px;font:600 13px/1.2 var(--ui);color:var(--ink2)}
.rlist{list-style:none;margin:0;padding:0;border-radius:var(--r-lg);background:var(--glass3);border:1px solid var(--hair)}
.rlist li{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-top:1px solid var(--hair);font:500 14px/1.35 var(--ui)}
.rlist li:first-child{border-top:0}
.rlist .day{color:var(--ink2);font-size:13px}
.mk{font:600 12px/1 var(--ui);padding:5px 8px;border-radius:999px;background:var(--well);color:var(--ink2)}
.mk.done{background:color-mix(in oklab,var(--qb) 18%,transparent);color:var(--ink)}
.mk.overdue{background:var(--danger-bg);color:var(--danger-ink)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 0}

.search{position:relative;margin:10px 0 4px}

/* ---------- logo: copied from Views/TasksDashboard/TasksDashboard.html (lines 814-857), unchanged ---------- */
/* round 5: the logo is the "advanced_logo" (logo session, round 4b), a button. At rest it shows its last frame; a click adds .play and
   the animation runs once (the cycle once instead of infinite). Its tile follows the app theme: white on light, black on dark */
.logo{width:auto;height:auto;border:0;border-radius:0;background:none;padding:0}
button.logo,button.logo:hover{min-height:0;background:none;border:0;box-shadow:none;transition:none}
.logo .td-adv{display:block;width:96.6px;height:37.6px;overflow:visible} /* 115 % of the 84 px first fit: "Dashboard" was only about 8 px tall */
.td-adv{--td-ink:#17181B;--td-ink2:#5C5953;--td-rim:#DDD7CC;--td-tile1:#FFFFFF;--td-tile2:#F8F6F1;--td-bloom:.28;--td-axis:#5C5953;--td-a:#B5392C;--td-ahot:#E0644F;--td-b:#1F6B4F;--td-c:#C2922A;--td-d:#8E8A84;--td-ga:#E0644F;--td-gb:#2F9A70;--td-gc:#E0A82E;--td-gd:#77736B}
:root[data-theme="dark"] .td-adv{--td-ink:#EEEAE1;--td-ink2:#A9A59C;--td-rim:#3A3D43;--td-bloom:.55;--td-tile1:#1E2024;--td-tile2:#141518;--td-axis:#77736B;--td-a:#E0644F;--td-ahot:#FF9A85;--td-b:#46A57F;--td-c:#E3B551;--td-d:#96928B;--td-ga:#FFB3A3;--td-gb:#7FD3AE;--td-gc:#F5D58A;--td-gd:#D8D4CC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .td-adv{--td-ink:#EEEAE1;--td-ink2:#A9A59C;--td-rim:#3A3D43;--td-bloom:.55;--td-tile1:#1E2024;--td-tile2:#141518;--td-axis:#77736B;--td-a:#E0644F;--td-ahot:#FF9A85;--td-b:#46A57F;--td-c:#E3B551;--td-d:#96928B;--td-ga:#FFB3A3;--td-gb:#7FD3AE;--td-gc:#F5D58A;--td-gd:#D8D4CC}}
.td-adv stop:first-child{stop-color:var(--td-tile1)}
.td-adv stop:last-child{stop-color:var(--td-tile2)}
.td-adv .ax{stroke:var(--td-axis)}
.td-adv .fd{stroke:var(--td-d)}
.td-adv .bl{fill:var(--td-a);opacity:var(--td-bloom)}
.td-adv .fa{fill:var(--td-a);stroke:var(--td-ahot)}
.td-adv .fb{fill:var(--td-b);stroke:var(--td-b)}
.td-adv .fc{fill:var(--td-c);stroke:var(--td-c)}
.td-adv .edge path:nth-child(1){stroke:var(--td-gc)}
.td-adv .edge path:nth-child(2){stroke:var(--td-gb)}
.td-adv .edge path:nth-child(3){stroke:var(--td-ga)}
.td-adv .edge path:nth-child(4){stroke:var(--td-gd)}
.td-adv .w,.td-adv .core{transform-box:view-box;transform-origin:7.56px 24.44px}
@media (prefers-reduced-motion:no-preference){
  .play .td-adv .ax{stroke-dasharray:1;animation:tdaf-draw .55s cubic-bezier(.4,0,.2,1) .05s both}
  .play .td-adv .core{animation:tdaf-grow .35s cubic-bezier(.2,.8,.2,1) .3s both}
  .play .td-adv .wc{animation:tdaf-c .5s cubic-bezier(.2,.8,.2,1) .45s both}
  .play .td-adv .wa{animation:tdaf-a .7s cubic-bezier(.2,.8,.2,1) .55s both}
  .play .td-adv .wb{animation:tdaf-b .85s cubic-bezier(.2,.8,.2,1) .55s both}
  .play .td-adv .fa{animation:tdaf-ignite .45s ease-out 1.3s both}
  .play .td-adv .bl{animation:tdaf-bloom .6s ease-out 1.35s both,tdaf-pa 4.8s 2s 1}
  .play .td-adv .edge{animation:tdaf-ge 4.8s linear 2s 1 both}
  .play .td-adv .fc,.play .td-adv .fb{animation:tdaf-pf 4.8s 2s 1}
  .play .td-adv .wm{animation:tdaf-word .6s cubic-bezier(.2,.8,.2,1) 1.1s both}
  @keyframes tdaf-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes tdaf-grow{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
  @keyframes tdaf-c{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  @keyframes tdaf-a{from{transform:rotate(30deg) scale(.85);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
  @keyframes tdaf-b{from{transform:rotate(60deg) scale(.85);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
  @keyframes tdaf-ignite{from{fill-opacity:.18;stroke:var(--td-a);stroke-width:1.11px}to{fill-opacity:1;stroke:var(--td-ahot);stroke-width:.59px}}
  @keyframes tdaf-bloom{from{opacity:0}to{opacity:var(--td-bloom)}}
  @keyframes tdaf-ge{0%{opacity:0;transform:none}3%{transform:translate(0.90px,-0.63px);opacity:1}4%{transform:translate(-0.76px,0.67px)}5%{transform:translate(0.63px,0.71px)}6%{transform:translate(-0.73px,-0.44px)}7%{transform:translate(0.47px,-0.60px)}8%{transform:translate(-0.49px,0.43px)}9%{transform:translate(0.50px,0.28px)}10%{transform:translate(-0.30px,-0.45px)}11%{transform:translate(0.35px,-0.18px)}12%{transform:translate(-0.19px,0.30px)}13%{transform:translate(0.19px,0.19px)}14%{transform:translate(-0.11px,-0.13px)}15%{transform:translate(0.06px,-0.06px)}16%{transform:translate(-0.03px,0.03px)}17%{transform:none;opacity:1}25%{opacity:0}100%{opacity:0;transform:none}}
  @keyframes tdaf-pf{0%,26%,100%{fill-opacity:.18}5%,15%{fill-opacity:.38}}
  @keyframes tdaf-pa{0%,28%,100%{opacity:var(--td-bloom)}5%,15%{opacity:1}}
  @keyframes tdaf-word{from{opacity:0;transform:translateX(-3px)}to{opacity:1;transform:none}}
}

.rlist li.rrow{display:block;padding:0;min-height:0}
.rvb{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px;border:0;background:transparent;text-align:left;color:var(--ink);font:500 14px/1.35 var(--ui)}
.rvb .mks{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rvb .day{color:var(--ink2);font-size:13px}
.rlist .num{font:500 14px/1 var(--serif);color:var(--ink3);margin-right:4px}
/* lists sheet, sharing, archive, install */
.lrow{display:flex;align-items:center;padding-right:4px;background:var(--glass3)}
.lrow .rowb{flex:1;min-width:0}
.lrow .ib{flex:none}
.lgrip{touch-action:none;color:var(--ink3)}
.lrow.dragging{position:relative;z-index:3;background:var(--solid);box-shadow:var(--depth);outline:2px solid var(--accent-line)}
.cbrow{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 12px;font:500 15px/1.3 var(--ui)}
.cbrow input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.people li{flex-wrap:wrap;padding:6px 0}
.people .who{flex:1 1 150px}
.people .ctl{display:flex;align-items:center;gap:6px;margin-left:auto}
.invite .row{flex-wrap:wrap}
.shr{padding:10px 14px}
.shr-h b{display:block;font:600 16px/1.3 var(--ui)}
.shr-b{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0 -10px}
.btn.dq{color:var(--danger-ink)}
.artools{display:flex;align-items:flex-end;gap:10px;margin:0 0 12px}
.artools .field{flex:1;margin:0}
.rlist li.arow{grid-template-columns:72px minmax(0,1fr)}
.aracts{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;margin-left:-10px}
.aracts .btn{min-height:44px;padding:0 10px}
.steps{margin:6px 0 0;padding-left:22px;font:400 15px/1.6 var(--font);color:var(--ink)}
.steps li{margin:4px 0}
.glyph{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--well);border:1px solid var(--hair2);vertical-align:middle;margin:0 2px}
.glyph svg.i{width:17px;height:17px}
fieldset.setting{min-width:0}
fieldset.setting>legend{float:left;width:100%;padding:0;margin:0 0 8px}
fieldset.setting>legend+*{clear:both}
.cl-lists{display:grid;gap:0;padding:0 4px 0 38px}
.cl-lists .cbrow{margin:0;min-height:44px}
/* timeline */
.tl li{padding:10px 0 10px calc(var(--d,0) * 14px)}
.tlr{display:flex;align-items:center;gap:6px;min-height:28px}
.tlr .num{font:500 14px/1 var(--serif);color:var(--ink3);flex:none}
.fold{margin:-8px -4px -8px -12px}
.fold svg{transition:transform .2s ease}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tl .track{position:relative;height:12px;border-radius:6px;background:var(--well);overflow:hidden}
.tl .track i{border-radius:6px}
.tl .track i.span{background:color-mix(in oklab,var(--c) 38%,transparent)}
.tl .track b{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.tl .early{color:var(--danger-ink);font-weight:600}
/* the dock above the tab bar: install hint, first-share note, new version */
.dock{position:fixed;z-index:35;left:calc(12px + var(--sal));right:calc(12px + var(--sar));bottom:calc(var(--tab-h) + 10px + var(--sab));max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dock:empty{display:none}
.notecard{pointer-events:auto;padding:12px 12px 10px 16px;border-radius:16px;background:var(--solid);border:1px solid var(--accent-line);box-shadow:var(--depth);font:500 14px/1.4 var(--ui);color:var(--ink)}
.notecard p{margin:0 0 8px}
.notecard .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.notecard .btn{min-height:44px;padding:0 14px;font-size:14px}
.toast{bottom:calc(var(--tab-h) + 16px + var(--sab) + var(--dockh,0px))}
main{padding-bottom:calc(var(--tab-h) + 88px + var(--sab) + var(--dockh,0px))}
/* ask for access */
#ac-body h2{font-size:clamp(38px,11vw,56px)}
#ac-body h2:focus{outline:none}
#ac-body>p{margin:12px 0 0;font:400 16px/1.5 var(--font);color:var(--ink2)}
#ac-body .acts{margin-top:22px}
.acdl{margin:16px 0 0;display:grid}
.acdl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font:500 14px/1.3 var(--ui)}
.acdl dt{color:var(--ink2)}
.acdl dd{margin:0;display:flex;align-items:center;gap:6px;color:var(--ink);overflow-wrap:anywhere;text-align:right}
.acdl .dot{width:8px;height:8px;border-radius:50%;background:var(--qc);flex:none}
.scan{position:relative;height:3px;margin:16px 0 0;border-radius:2px;background:var(--well);overflow:hidden}
.scan::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:var(--accent);animation:scan 1.1s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.coffee{display:block;width:min(240px,72%);height:auto;margin:0 0 6px}
.coffee .ax{fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-linecap:round}
.coffee .cup{fill:var(--solid);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.coffee .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.coffee .brew{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.coffee .st{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;animation:steam 2.4s ease-in-out infinite}
.coffee .st.s2{animation-delay:-.8s}.coffee .st.s3{animation-delay:-1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.signin .fine{margin:14px 0 0;color:var(--ink2);font:500 14px/1.4 var(--ui)}
.signin .priv a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin:0 -6px;color:var(--accent-ink);font-weight:600}
.si-hint{margin:0 0 12px;color:var(--ink2);font:500 13px/1.4 var(--ui)}
/* welcome, two steps */
dialog.alert.wl{max-width:440px;max-height:calc(var(--vvh,100dvh) - 32px);overflow:auto}
dialog.alert.wl p.wl-step{margin:0 0 4px;font:600 13px/1.2 var(--ui);color:var(--ink2)}
.wl-dl{margin:0 0 14px;display:grid;gap:10px}
.wl-dl dt{display:flex;justify-content:space-between;gap:8px;font:600 15px/1.3 var(--ui)}
.wl-dl dd{margin:2px 0 0;font:400 14px/1.4 var(--font);color:var(--ink2)}
.wl-ul{margin:0 0 14px;padding-left:20px;font:400 15px/1.45 var(--font);color:var(--ink2)}
.wl-ul li{margin:0 0 6px}
.wl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.wl-dots{display:flex;gap:6px}
.wl-dots i{width:8px;height:8px;border-radius:50%;background:var(--hair2)}
.wl-dots i.on{background:var(--accent)}
/* judge r4 sev-2: with the keyboard up (or a short viewport) a sheet header shrinks so the body keeps room */
@media (max-height:440px){
  dialog.sheet .grabzone{display:none}
  dialog.sheet .shead{padding-top:4px;padding-bottom:4px}
  dialog.sheet .shead h2{font-size:20px}
  dialog.sheet .pos{display:none}
  dialog.sheet .sfoot,dialog.sheet .askbar{padding-top:8px;padding-bottom:calc(8px + var(--sab))}
}
:root.kb-up dialog.sheet .grabzone{display:none}
:root.kb-up dialog.sheet .shead{padding-top:4px;padding-bottom:4px}
:root.kb-up dialog.sheet .shead h2{font-size:20px}
:root.kb-up dialog.sheet .pos{display:none}
:root.kb-up dialog.sheet .sfoot{padding-top:8px;padding-bottom:8px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .pill[data-s="saving"] .dot{animation:none}
}
.linkb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;min-height:28px;font:inherit;color:inherit;text-align:left;overflow-wrap:anywhere}.linkb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tl li.closed{opacity:.6}
h2[tabindex="-1"]:focus{outline:none}
/* real data: long words and links in titles and descriptions wrap, never scroll a quadrant sideways */
.card .ttl,.card .d,.card .meta,.card .tags{overflow-wrap:anywhere;min-width:0}
.quad .cards{overflow-x:hidden}
</style>
</head>

<script>
"use strict";
/* Tasks on the phone (app/index.html): the UI of prototype p2 v6 on the real data layer.
   Data: app/td-data.js (TDData, every write goes through it), rules: app/td-core.js (TDCore), config: ../config/tasksdashboard.config.js.
   This file: start, sign-in, access gate, board, quick add, task sheet, gestures, Move picker, Lists sheet, sync pill.
   app-ui-part2.js (built after this file into the same script): Review, Search, Me and its pages, Share and People sheets, notices,
   welcome, install hint, and the start (boot). Built by build-app-index.mjs into app/index.html. */
const C = window.TDCore;
const D = window.TDData.create({ config: window.TD_CONFIG });
D.attach(window, document);

/* ---------- constants and helpers ---------- */
const QS = C.QS;
const GEO = ['B', 'A', 'D', 'C']; /* the web board's geometry, also the focus order */
const QN = { A: 'Do', B: 'Plan', C: 'Delegate', D: 'Eliminate' };
const QH = { A: 'Important and urgent', B: 'Important, not urgent', C: 'Urgent, not important', D: 'Neither' };
const DAY = 864e5;
const PRIVACY = 'We store your email, name and the items you create. Only people you share a list with see them. Ask Maksym to delete your account.'; /* the web's PRIVACY, word for word */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const tablet = matchMedia('(min-width: 600px)');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const now = () => Date.now();
const pad = v => String(v).padStart(2, '0');
const ymd = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const hm = d => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
const dayDiff = d => Math.round((midnight(d) - midnight(now())) / DAY);
const atDay = (n, time) => { const x = new Date(); x.setDate(x.getDate() + n); return new Date(`${ymd(x)}T${time}`); };
const fromInputs = (d, t, def) => d ? new Date(`${d}T${t || def}`) : null;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dayLabel = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
/* a date with no time: End at 23:59, Start at 00:00 (local) */
const END_T = '23:59', START_T = '00:00';

/* ---------- state ---------- */
const S = { tab: 'board', q: 'A', ready: false, flip: new Set(), more: new Set(), hint: store.get('td.app.hint') !== 'off', lastList: store.get('td.app.lastList') || '' };

/* ---------- reading the data layer ---------- */
const me = () => D.me;
const L = id => D.listById[id];
const lname = id => L(id) ? L(id).name : '?';
const role = id => D.roles[id];
const ref = t => ((lname(t.list)[0] || '?').toUpperCase()) + t.num; /* the web's refText: list initial + number */
/* the phone's own list choice (localStorage td.app.list), so the desktop's prefs.list stays as it is; prefs.list is the first default */
const LIST_KEY = 'td.app.list';
const curListId = () => { const p = store.get(LIST_KEY) || D.prefs.list; return p !== 'all' && L(p) ? p : 'all'; };
const setList = id => store.set(LIST_KEY, id);
const curList = () => { const id = curListId(); return id === 'all' ? null : L(id); };
const isClosed = t => C.CLOSED.includes(t.status);
const openAll = () => D.all().filter(t => !isClosed(t));
const inList = t => curListId() === 'all' || t.list === curListId();
const openIn = q => openAll().filter(t => inList(t) && t.q === q).sort(C.byOrder);
const overdue = t => !!(t.deadline && t.deadline.getTime() < now());
const dueInfo = t => {
  if (!t.deadline) return null;
  const d = dayDiff(t.deadline), od = overdue(t), soon = !od && C.dueSoon(t, D.settings, now());
  const txt = d < 0 ? `${-d} d overdue` : d === 0 ? (od ? 'overdue today' : 'due today') : d === 1 ? 'due tomorrow' : `due in ${d} d`;
  return { cls: od ? 'overdue' : soon ? 'soon' : '', txt, od };
};
const canAdd = id => D.canDo('add', null, id);
const addable = () => D.lists.filter(canAdd);
const readOnlyList = () => { const l = curList(); return !!(l && (l.archived_at || !canAdd(l.id))); };
const roTask = t => isClosed(t) || !D.canDo('edit', t) || !!(L(t.list) && L(t.list).archived_at);
const canDel = t => !isClosed(t) && D.canDo('delete', t);
const lowConf = t => t.reviewState === 'needs_review';
const showSource = () => C.showSource(D.cardLayout, curListId() !== 'all');
const personName = id => !id ? '' : me() && id === me().id ? 'you' : D.names[id] || 'someone';
const mineTag = id => !!(me() && (me().mine_tag_ids || []).includes(id));
const grouped = () => D.cardLayout.group && D.linksReady;
const ixNow = () => D.linkIx();
const cardMode = () => (D.prefs.cards && D.prefs.cards.mode) || 'collapsed';
const isEx = t => (cardMode() === 'expanded') !== S.flip.has(t.id);
/* a quadrant's rows as drawn: the web's order (byOrder), grouped by parent with Tasks Grouping on (groupCards, ghost rows) */
function shownIn(q) {
  const cards = openIn(q);
  if (!grouped()) return cards.map(t => ({ t, depth: 0 }));
  const R = ixNow();
  return C.groupCards(cards, R.ix, R.by);
}

/* ---------- sync pill: Saved / Sync / Offline N waiting / Conflict / Session ended (D.syncState) ---------- */
const PILL = { saved: 'saved', saving: 'sync', offline: 'offline', conflict: 'conflict', ended: 'session' };
let pullT = 0;
function setPill() {
  const st = D.syncState(), s = pullT && st.state === 'saved' ? 'sync' : PILL[st.state] || 'saved', p = $('#pill');
  p.dataset.s = s;
  const txt = s === 'saved' ? 'Saved' : s === 'sync' ? 'Sync' : s === 'offline' ? (st.n === 1 ? 'Offline: 1 change waiting' : st.n ? `Offline: ${st.n} changes waiting` : 'Offline') : s === 'conflict' ? 'Conflict' : 'Session ended. Sign in again.';
  $('#pill-t').textContent = txt;
  p.setAttribute('aria-label', s === 'conflict' ? 'Someone else changed a task. Check it before you save.' : s === 'sync' ? 'Syncing your tasks' : s === 'saved' ? 'Saved. Tap for sync details' : `Sync: ${txt}`);
}
/* pull: on pull to refresh and from the pill's menu */
async function pullSync() {
  if (!D.session || !S.ready) return;
  clearTimeout(pullT); pullT = setTimeout(() => { pullT = 0; setPill(); }, 600); setPill();
  await D.poll(true);
}

/* ---------- toast with undo ---------- */
let toastT, undoFn = null;
function toast(msg, undo) {
  const el = $('#toast'), host = [...document.querySelectorAll('dialog[open]')].pop();
  (host && host.id !== 'dlg-signin' && host.id !== 'dlg-access' ? host : document.body).appendChild(el);
  $('#toast-t').textContent = msg; undoFn = undo || null; $('#toast-undo').hidden = !undo;
  el.classList.add('show'); clearTimeout(toastT);
  if (undo && !document.querySelector('dialog[open]')) requestAnimationFrame(clearUndo);
  toastT = setTimeout(hideToast, undo ? 8000 : 3200);
}
function clearUndo() {
  document.body.classList.add('toasting');
  for (let k = 0; k < 4; k++) {
    const u = $('#toast-undo').getBoundingClientRect(); let need = 0;
    for (const c of document.querySelectorAll('main .card button')) { const r = c.getBoundingClientRect(); if (!r.width) continue; if (r.left < u.right && r.right > u.left && r.top < u.bottom && r.bottom > u.top) need = Math.max(need, r.bottom - u.top + 6); }
    if (!need) return; const y = scrollY; window.scrollTo(0, y + need); if (scrollY === y) return;
  }
}
function hideToast() { document.body.classList.remove('toasting'); $('#toast').classList.remove('show'); undoFn = null; }
$('#toast-undo').addEventListener('click', () => { const f = undoFn; hideToast(); if (f) f(); });
/* an action's result: { msg, undo } from TDData, or { ok:false, err } from an async call */
function said(r, msg) {
  if (!r) return r;
  if (r.ok === false) { toast(r.err ? r.err.message : 'That did not go through.'); return r; }
  if (msg !== '' && (msg || r.msg)) toast(msg || r.msg, r.undo || undefined);
  return r;
}

/* ---------- render: chips, map, board ---------- */
let renderQ = 0;
function renderSoon() { if (!renderQ) renderQ = requestAnimationFrame(() => { renderQ = 0; renderAll(); }); }
function renderChips() {
  const all = openAll(), od = l => all.filter(t => (l === 'all' || t.list === l) && overdue(t)).length, cur = curListId();
  const chip = (id, name, n, o) => `<button class="chip" data-act="list" data-id="${esc(id)}" aria-current="${cur === id}">${esc(name)} <span class="n">${n}</span>${o ? `<span class="od" aria-label="${o} overdue">${o}</span>` : ''}</button>`;
  let h = chip('all', 'All', all.length, od('all'));
  for (const id of D.lists) h += chip(id, lname(id), all.filter(t => t.list === id).length, od(id));
  h += `<button class="chip ghost" data-act="lists" aria-haspopup="dialog">${ic('lists')}Lists</button>`;
  $('#chiprow').innerHTML = h;
}
function renderMap() {
  const m = $('#map'), loading = m.classList.contains('loading'), lim = D.settings.doLimit;
  m.dataset.sel = S.q;
  m.innerHTML = GEO.map(q => {
    const list = openIn(q), n = list.length, od = list.filter(overdue).length, over = q === 'A' && lim > 0 && n > lim;
    return `<button class="tile${over ? ' over' : ''}" data-q="${q}" data-act="quad" aria-pressed="${S.q === q}"><span class="in"><span class="verb">${QN[q]}</span><span class="foot"><span class="sub"><span class="hl"><span class="lt" aria-hidden="true">${q}</span><span class="hint">${QH[q]}</span></span>${od ? `<span class="od">${od} overdue</span>` : ''}</span><span class="cnt">${loading ? '' : n}<span class="vh"> open${over ? ', over the Do limit' : ''}</span></span></span></span></button>`;
  }).join('');
  $('#wash').dataset.q = S.q; $('#wash').classList.add('on');
}
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(?!\s)(.+?)\*/g, '<i>$1</i>');
function md(s) { /* markdown (bold, italic, "- " lists), the web's subset, to HTML */
  let h = '', ul = false;
  for (const line of String(s || '').split('\n')) {
    const m = line.match(/^\s*[-*] (.*)$/);

const plainT = s => String(s || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(?!\s)(.+?)\*/g, '$1');

/* the web's matchQ: 12, #12, H12 (list initial + number), else words in the title, the description and the tag names */
function matchQ(t, q) {
  q = String(q || '').trim().toLowerCase(); if (!q) return true;
  const r = q.replace(/^#/, '');
  if (/^\p{L}?\d+$/u.test(r)) { const m = r.match(/^(\p{L}?)(\d+)$/u); if (String(t.num) === m[2] && (!m[1] || (lname(t.list)[0] || '').toLowerCase() === m[1])) return true; }

/* web: loadCancelTimes. When each cancelled task was cancelled (item_events), read once per task and close time */
const CANCEL_AT = {}, CANCEL_KEY = {};
async function loadCancelTimes(tasks) {
  const want = tasks.filter(t => t.status === 'cancelled' && t.doneAt && CANCEL_KEY[t.id] !== t.doneAt.getTime());
  if (!want.length) return false;
  want.forEach(t => { CANCEL_KEY[t.id] = t.doneAt.getTime(); });
  for (let i = 0; i < want.length; i += 80) {
    const ids = want.slice(i, i + 80).map(t => t.id);
    const r = await D.getAll('item_events?select=item_id,at,status:diff->status&item_id=in.(' + ids.join(',') + ')&diff->status->>new=eq.cancelled');
    if (!r.ok) { want.slice(i).forEach(t => { delete CANCEL_KEY[t.id]; }); return i > 0; }
    Object.assign(CANCEL_AT, C.cancelTimes(r.json));
  }
  return true;
}

  rvInit();

  loadCancelTimes(tasks).then(ch => { if (ch && S.tab === 'review') renderSoon(); });
  const entries = C.reviewEntries(tasks, RV.sel, now(), CANCEL_AT);
  return { tasks, entries, groups: C.reviewGroups(entries, D.lists), period: C.reviewPeriod(RV.sel) };

/* Visuals: the history of the chosen lists from db/013 kpi_events (REST pages without it), rebuilt by TDCore (kpiHistory) */
let KPI_LISTS = null, KPI_RPC = null, KPI_ERR = '';
const KPI_CACHE = {};
const KPI_ITEM_COLS = 'id,list_id,quadrant,status,due_at,urgent_pin,category,deleted_at,created_at';
const kpiArchivedLists = () => (KPI_LISTS || []).filter(l => l.archived_at);
const kpiIds = () => (KPI_LISTS || []).filter(l => !VIS.lists.size || VIS.lists.has(l.id) || (VIS.lists.has('archived') && l.archived_at)).map(l => l.id).sort();
const kpiArchived = () => Object.fromEntries(kpiArchivedLists().map(l => [l.id, Date.parse(l.archived_at)]));
async function kpiLoad() {
  if (!D.session || !S.ready) return;
  rvInit();
  if (!KPI_LISTS) {
    const r = await D.getAll('lists?select=id,slug,name,archived_at');
    if (!r.ok) { KPI_ERR = r.err.message; return renderSoon(); }
    KPI_ERR = '';
    KPI_LISTS = r.json.filter(l => !C.isTestList(l)).sort((a, b) => !!a.archived_at - !!b.archived_at || (D.lists.indexOf(a.id) + 1 || 1e9) - (D.lists.indexOf(b.id) + 1 || 1e9) || a.name.localeCompare(b.name));
  }
  const ids = kpiIds(), key = ids.join();
  if (KPI_CACHE[key] && KPI_CACHE[key].status === 'error') delete KPI_CACHE[key];
  if (!ids.length || KPI_CACHE[key]) return renderSoon();
  const c = KPI_CACHE[key] = { status: 'loading' };
  renderSoon();
  let items = null, events = null;
  if (KPI_RPC !== false) {
    const r = await D.rpc('kpi_events', { p_lists: ids });
    if (r.ok && r.json && Array.isArray(r.json.items)) { items = r.json.items; events = r.json.events || []; KPI_RPC = true; }
    else if (r.status === 404) KPI_RPC = false;
    else { Object.assign(c, { status: 'error', error: r.err ? r.err.message : 'no answer' }); return renderSoon(); }
  }
  if (!items) {
    const within = 'in.(' + ids.join(',') + ')';
    const [a, b] = await Promise.all([D.getAll('items?select=' + KPI_ITEM_COLS + '&list_id=' + within),
      D.getAll('item_events?select=id,item_id,at,' + C.KPI_COLUMNS.map(k => k + ':diff->' + k).join(',') + ',items!inner(list_id)&items.list_id=' + within + '&action=neq.create')]);
    if (!a.ok || !b.ok) { Object.assign(c, { status: 'error', error: (a.err || b.err).message }); return renderSoon(); }
    items = a.json; events = b.json;
  }
  Object.assign(c, { status: 'ok', hists: C.kpiHistory(items, events) });
  renderSoon();
}
