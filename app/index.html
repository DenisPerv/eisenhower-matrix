      return `<li data-q="${t.q}" style="--d:${r.depth}"${r.closed ? ' class="closed"' : ''}><div class="tlr">${r.kids ? `<button class="ib fold" data-act="tl-fold" data-tid="${t.id}" aria-expanded="${!r.collapsed}" aria-label="${r.collapsed ? 'Show' : 'Hide'} the subtasks of ${esc(ref(t))}">${ic('chev')}</button>` : ''}<button class="linkb" data-act="open-id" data-tid="${t.id}"><span class="num">${esc(ref(t))}</span><span>${esc(plainT(t.title))}</span></button></div>
        <span class="track" aria-hidden="true">${span}${bar}${today >= 0 && today < DAYS ? `<b style="left:${pos(today + 0.5).toFixed(1)}%"></b>` : ''}</span>
        <small>${when}. ${r.closed ? esc(t.status) : QN[t.q]}.</small>${p ? `<small class="early">Starts too early: ${esc(ref(p))} ends ${p.deadline ? dayLabel(p.deadline) : '?'}.</small>` : ''}</li>`;
    }).join('');
    el.innerHTML = `<div class="wknav" style="margin-top:0"><button class="btn quiet" data-act="tl-shift" data-d="-1">${ic('back')}Earlier</button><button class="btn quiet" data-act="tl-shift" data-d="0">This week</button><button class="btn quiet" data-act="tl-shift" data-d="1">Later${ic('next')}</button></div>
      <p class="src">Open tasks${curListId() === 'all' ? '' : ' in ' + esc(lname(curListId()))} with a Start or End date, ${dayLabel(new Date(start))} to ${dayLabel(new Date(addDaysMs(start, DAYS - 1)))}. Bars run from Start to End in the quadrant’s colour; the thin line is today. A paler bar is a parent’s span over its subtasks.</p>
      ${rows ? `<ul class="tl">${rows}</ul>` : '<div class="empty"><p>No tasks with dates in these weeks.</p></div>'}`;
  } },
  'pg-install': { title: 'Install the app', render(el) {
    el.innerHTML = standalone() ? '<p class="src">Tasks is installed on this phone. It opens from your home screen.</p>' : `
      <div class="setting"><h3>On Android</h3><p>Chrome installs Tasks. It then opens from your home screen, full screen, without the browser bar.</p><button class="btn primary" data-act="inst-android">${ic('plus')}Install app</button>${instEvt ? '' : '<p class="src" style="margin:8px 0 0">If nothing happens, open Chrome’s menu and tap Install app or Add to Home screen.</p>'}</div>
      <div class="setting"><h3>On iPhone</h3><p>Safari adds Tasks to your home screen in two steps:</p><ol class="steps"><li>Tap Share <span class="glyph">${ic('share')}</span><span class="vh">, the square with an arrow,</span> in Safari’s toolbar.</li><li>Tap Add to Home Screen.</li></ol></div>`;
  } },
};
function drawPreview() { const box = $('#cl-prev'); if (!box) return; box.innerHTML = `<ul class="cards">${cardHTML(previewTask(), 0, true)}</ul>`; box.querySelectorAll('button').forEach(b => { b.tabIndex = -1; b.disabled = true; }); }

/* ---------- S10 Share and People sheets (web: openShare): who is on it, pending invitations, the share form; a first share to a known
   account joins at once (db/012 p_join). Read again on open, after each action and every 10 s while open ---------- */
let SH = null, shTick = 0;
function openShare(kind, id) {
  const isList = kind === 'list', target = isList ? (L(id) || D.hiddenLists.find(l => l.id === id)) : D.tagLists[id]; if (!target) return;
  const myRole = isList ? role(id) : target.role, owner = myRole === 'owner' && human(), sharer = C.canShare(myRole, kind) && human();
  SH = { kind, id, owner, sharer, name: target.name, last: null };
  const roles = (isList ? C.LIST_ROLES : C.TAG_LIST_ROLES).filter(r => r !== 'owner');
  const what = isList ? 'Editor changes everything, Contributor adds and edits their own tasks, Viewer reads.' : 'They see these tags on tasks they can already see. Viewer puts them on tasks; Contributor also adds, renames and reorders tags; Editor also deletes and moves tags, deletes the list and shares it.';
  $('#share-h').textContent = sharer ? `Share ${target.name}` : `People in ${target.name}`;
  $('#share-body').innerHTML = `${sharer ? `<p class="src" style="margin-top:0">${what}</p>` : ''}<ul class="people" id="sh-people" aria-live="polite"><li><span class="src">Loading…</span></li></ul>
    ${sharer ? `<form id="inv" class="setting" novalidate><h3>Invite someone</h3><label class="field"><span>Email</span><input class="inp" id="inv-email" type="email" inputmode="email" autocomplete="off" spellcheck="false" maxlength="254" aria-describedby="inv-err"></label><p class="err" id="inv-err" role="alert" hidden>Enter an email address like name@example.com.</p><label class="field"><span>Role</span><select class="inp" id="inv-role">${roles.map(r => `<option value="${r}"${r === 'viewer' ? ' selected' : ''}>${ROLE_NAME[r]}</option>`).join('')}</select></label><button class="btn primary block" type="submit" id="inv-go">Invite</button><p class="src" style="margin:10px 0 0">No email is sent. Someone who already has an account sees it at once the first time you share with them; anyone else signs in to Tasks with Google and accepts it under Me, Sharing.</p></form>` : ''}`;
  openDlg('dlg-share');
  const f = $('#inv');
  if (f) {
    $('#inv-email').oninput = () => { $('#inv-err').hidden = true; $('#inv-email').removeAttribute('aria-invalid'); };
    f.onsubmit = async e => {
      e.preventDefault(); const v = $('#inv-email').value.trim(), r0 = $('#inv-role').value, s = SH;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { $('#inv-err').textContent = 'Enter an email address like name@example.com.'; $('#inv-err').hidden = false; $('#inv-email').setAttribute('aria-invalid', 'true'); $('#inv-email').focus(); return; }
      $('#inv-go').disabled = true; const r = await D.share(s.kind, s.id, v, r0); if ($('#inv-go')) $('#inv-go').disabled = false;
      if (!r.ok) { $('#inv-err').textContent = r.err.message; $('#inv-err').hidden = false; $('#inv-email').focus(); return; }
      $('#inv-email').value = ''; toast(`Shared with ${v} as ${ROLE_NAME[r0].toLowerCase()}.`); loadPeople();
    };
  }
  loadPeople();
  clearInterval(shTick); shTick = setInterval(() => { if (!$('#dlg-share').open) { clearInterval(shTick); return; } if (document.visibilityState === 'visible') loadPeople(true); }, 10000);
}
async function loadPeople(quiet) {
  const s = SH; if (!s) return;
  const r = await D.people(s.kind, s.id);
  if (SH !== s || !$('#dlg-share').open) return;
  const box = $('#sh-people');
  if (!r.ok) { if (!quiet) box.innerHTML = `<li><span class="err">${esc(r.err.message)}</span></li>`; return; }
  const rows = r.json.slice().sort((a, b) => (a.state === 'member' ? 0 : 1) - (b.state === 'member' ? 0 : 1) || (a.role === 'owner' ? -1 : 0) - (b.role === 'owner' ? -1 : 0));
  const key = JSON.stringify(rows);
  if (quiet && (key === s.last || (box.contains(document.activeElement) && document.activeElement.tagName === 'SELECT'))) return;
  s.last = key;
  const roles = (s.kind === 'list' ? C.LIST_ROLES : C.TAG_LIST_ROLES).filter(x => x !== 'owner');
  box.innerHTML = rows.map(p => {
    const member = p.state === 'member', you = member && p.profile_id === me().id, name = member ? (you ? me().display_name : p.display_name || 'someone') : p.email;
    const ctl = p.role === 'owner' ? `<span class="badge">Owner</span>`
      : member ? (s.owner ? `<span class="ctl"><select aria-label="Role of ${esc(name)}" data-act="sh-role" data-pid="${esc(p.profile_id)}">${roles.map(x => `<option value="${x}"${x === p.role ? ' selected' : ''}>${ROLE_NAME[x]}</option>`).join('')}</select><button class="btn quiet dq" data-act="sh-remove" data-pid="${esc(p.profile_id)}">Remove<span class="vh"> ${esc(name)}</span></button></span>` : `<span class="badge">${ROLE_NAME[p.role] || esc(p.role)}</span>`)
      : `<span class="ctl">${s.sharer ? `<button class="btn quiet" data-act="sh-revoke" data-id="${esc(p.invite_id)}">Revoke<span class="vh"> the invitation to ${esc(p.email)}</span></button>` : ''}</span>`;
    return `<li><span class="ini" aria-hidden="true">${esc((name || '?')[0].toUpperCase())}</span><span class="who"><b>${esc(name)}${you ? ' (you)' : ''}</b><small>${member ? esc(p.email || '') : `Invited, waiting. ${ROLE_NAME[p.role] || esc(p.role)}`}</small></span>${ctl}</li>`;
  }).join('') || '<li><span class="src">Nobody yet.</span></li>';
}
$('#share-body').addEventListener('change', async e => {
  const x = e.target; if (x.dataset.act !== 'sh-role' || !SH) return;
  said(await D.setRole(SH.kind, SH.id, x.dataset.pid, x.value), 'Role changed.'); loadPeople();
});

/* ---------- the welcome note (web: showWelcome): two steps, once per person and version (prefs.welcomeVersion) ---------- */
let WL = 0;
function welcome() { WL = 0; drawWelcome(); if (!$('#dlg-welcome').open) openDlg('dlg-welcome'); const p = $('#wl-body .btn.primary'); if (p) p.focus(); }
function welcomeDone() { D.setPrefs({ welcomeVersion: C.WELCOME_VERSION, welcomeSeen: true }); closeDlg('dlg-welcome'); }
function drawWelcome(announce) {
  const s = D.settings, dots = `<span class="wl-dots" aria-hidden="true">${[0, 1].map(i => `<i${i === WL ? ' class="on"' : ''}></i>`).join('')}</span>`;
  $('#wl-body').innerHTML = WL === 0
    ? `<p class="wl-step">Welcome. Step 1 of 2</p><h2 id="wl-h" tabindex="-1">Urgency</h2><p>Tasks near their end date move up and stand out. Your values now:</p><dl class="wl-dl"><div><dt>Urgency window <span>${s.windowDays} ${s.windowDays === 1 ? 'day' : 'days'}</span></dt><dd>A task without a fixed quadrant moves to Do when its end date is this close.</dd></div><div><dt>Due soon <span>${s.threshold}%</span></dt><dd>A card is marked due soon when less than this share of the window is left.</dd></div><div><dt>Do limit <span>${s.doLimit || 'off'}</span></dt><dd>The Do count turns red above this number.</dd></div></dl><button class="btn quiet block" data-act="wl-urg">Set urgency now</button><div class="wl-foot"><button class="btn" data-act="wl-later">Later</button>${dots}<button class="btn primary" data-act="wl-next">Next</button></div>`
    : `<p class="wl-step">Welcome. Step 2 of 2</p><h2 id="wl-h" tabindex="-1">Moving between tasks</h2><ul class="wl-ul"><li>In an open task, swipe its header left or right for the next or previous task in the quadrant.</li><li>The slim tabs at the sheet’s sides do the same.</li><li>Unsaved changes ask first.</li></ul><button class="btn quiet block" data-act="wl-cl">Open Card layout</button><div class="wl-foot"><button class="btn" data-act="wl-back">Back</button>${dots}<button class="btn primary" data-act="wl-done">Done</button></div>`;
  if (announce) { $('#wl-live').textContent = `Step ${WL + 1} of 2`; $('#wl-h').focus(); }
}
$('#dlg-welcome').addEventListener('cancel', e => { e.preventDefault(); welcomeDone(); });

/* ---------- the dock: first-share notices (web: drawNotices) and the install hint ---------- */
function drawNotices() {
  const open = S.ready && human() ? D.notices : [], ids = new Set(open.map(n => 'n-ntc-' + n.id));
  document.querySelectorAll('#dock [id^="n-ntc-"]').forEach(el => { if (!ids.has(el.id)) unnote(el.id); });
  open.forEach(n => { const id = 'n-ntc-' + n.id; if (document.getElementById(id)) return;
    note(id, `<p id="${id}-p">${esc(C.noticeText(n))}</p><div class="row"><button class="btn quiet dq" data-act="ntc" data-v="block" data-id="${esc(n.id)}">Block</button><button class="btn quiet" data-act="ntc" data-v="leave" data-id="${esc(n.id)}">Leave</button><button class="btn primary" data-act="ntc" data-v="seen" data-id="${esc(n.id)}">Keep</button></div>`); });
}
let instEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; if (S.ready) installHint(); });
addEventListener('appinstalled', () => { instEvt = null; unnote('n-install'); store.set(INST_KEY, 'installed'); });
function installHint() {
  if (standalone() || store.get(INST_KEY)) return;
  if (isIOS()) note('n-install', `<p id="n-install-p">Install Tasks: tap Share <span class="glyph">${ic('share')}</span><span class="vh">, the square with an arrow,</span> then Add to Home Screen.</p><div class="row"><button class="btn" data-act="inst-dismiss">Got it</button></div>`);
  else if (instEvt) note('n-install', `<p id="n-install-p">Install Tasks on this phone. It opens from your home screen like an app.</p><div class="row"><button class="btn quiet" data-act="inst-dismiss">Not now</button><button class="btn primary" data-act="inst-android">Install app</button></div>`);
}
async function doInstall() {
  if (!instEvt) { toast(isIOS() ? 'In Safari: tap Share, then Add to Home Screen.' : 'Open the browser menu and tap Install app or Add to Home screen.'); return; }
  const ev = instEvt; instEvt = null; unnote('n-install');
  try { ev.prompt(); const c = await ev.userChoice; store.set(INST_KEY, c && c.outcome === 'accepted' ? 'installed' : 'dismissed'); } catch (e) { store.set(INST_KEY, 'dismissed'); }
}
function afterLoad() {
  drawBadge(); drawNotices();
  if (human() && C.welcomeDue(D.prefs)) setTimeout(() => { if (S.ready && !document.querySelector('dialog[open]')) welcome(); }, 400);
  installHint();
}

/* ---------- part 2 actions (the main click handler's default case) ---------- */
async function part2Click(a, b) {
  const id = b.dataset.id, tid = b.dataset.tid;
  if (a.startsWith('pg-')) { openPage(a); return; }
  switch (a) {
    case 'week': { const k = b.dataset.w, s = new Set(RV.sel); if (s.has(k)) { if (s.size > 1) s.delete(k); } else s.add(k); RV.sel = [...s].sort(); renderReview(); if (S.tab === 'review') kpiLoad(); const nb = $(`#v-review [data-w="${k}"]`); if (nb) nb.focus(); break; }
    case 'wk-shift': { const d = +b.dataset.d; RV.first = addDaysMs(RV.first, d * 7); RV.scroll = d < 0 ? 'start' : 'end'; renderReview(); $(`#v-review [data-act="wk-shift"][data-d="${d}"]`).focus(); break; }
    case 'rlist': { if (id === 'all') RV.lists.clear(); else RV.lists.has(id) ? RV.lists.delete(id) : RV.lists.add(id); renderReview(); const nb = $(`#v-review [data-act="rlist"][data-id="${id}"]`); if (nb) nb.focus(); break; }
    case 'vlist': { if (id === 'all') VIS.lists.clear(); else VIS.lists.has(id) ? VIS.lists.delete(id) : VIS.lists.add(id); renderReview(); kpiLoad(); const nb = $(`#vis [data-act="vlist"][data-id="${id}"]`); if (nb) nb.focus(); break; }
    case 'vrange': { VIS.range = b.dataset.v; renderReview(); const nb = $(`#vis [data-act="vrange"][data-v="${b.dataset.v}"]`); if (nb) nb.focus(); break; }
    case 'export': await exportReview(); break;
    case 'f-open': SF.open = SF.open === b.dataset.k ? null : b.dataset.k; renderSearch(); { const f = $('#fopts .chip'); if (f && SF.open) f.focus(); } break;
    case 'f-set': {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === 'due') { SF.due = v === 'any' || SF.due === v ? null : v; SF.open = null; renderSearch(); $('#filters [data-k="due"]').focus(); }
      else { SF[k] = SF[k].includes(v) ? SF[k].filter(x => x !== v) : [...SF[k], v]; renderSearch(); const nb = [...document.querySelectorAll('#fopts [data-v]')].find(x => x.dataset.v === v); if (nb) nb.focus(); }
      break;
    }
    case 'f-toggle': { const k = b.dataset.k; SF[k] = !SF[k]; renderSearch(); $(`#filters [data-k="${k}"]`).focus(); break; }
    case 'f-clear': Object.assign(SF, { due: null, tag: [], cat: [], check: false, mine: false, open: null }); renderSearch(); $('#q').focus(); break;
    case 'arch-open': AR.q = $('#q').value.trim(); openPage('pg-archive'); break;
    case 'me-back': mePage = null; renderMe(); $('#me-h').focus(); break;
    case 'ar-all': AR.q = ''; renderMe(); $('#me-h').focus(); break;
    case 'restore': { const r = await D.restoreTask(tid); if (r) toast(r.msg + '.', r.undo); else toast('That did not go through.'); renderAll(); break; }
    case 'ar-del': { const t = task(tid); if (!t) break; if (await confirmDlg({ title: `Delete ${ref(t)}?`, body: plainT(t.title), yes: 'Delete', no: 'Keep' })) { said(D.removeTask(tid), `Deleted ${ref(t)}.`); renderAll(); } break; }
    case 'ar-clear': {
      const rows = closedAll().filter(t => matchQ(t, AR.q) && D.canDo('delete', t));
      if (await confirmDlg({ title: 'Clear the archive?', body: `${rows.length} finished ${rows.length === 1 ? 'task is' : 'tasks are'} deleted${AR.q ? ` (the ones matching “${AR.q}”)` : ''}.`, yes: 'Clear', no: 'Cancel' })) { rows.forEach(t => D.removeTask(t.id)); renderAll(); toast(`Deleted ${rows.length} ${rows.length === 1 ? 'task' : 'tasks'}.`); }
      break;
    }
    case 'alist-restore': { const r = await D.restoreList(id); said(r); if (r.ok && mePage) { mePage.rows = null; mePage.load(); } renderAll(); break; }
    case 'hlist-show': { const r = await D.hideList(id, false); said(r); renderAll(); break; }
    case 'swm-hide': { const l = L(id); const r = await D.hideList(id, true); if (r.ok) toast(`Hid ${l ? l.name : 'the list'}.`, async () => { said(await D.hideList(id, false)); renderAll(); }); else said(r); renderAll(); break; }
    case 'swm-leave': { const l = L(id) || D.hiddenLists.find(x => x.id === id); if (l && await confirmDlg({ title: `Leave ${l.name}?`, body: `You lose access until ${D.names[l.owner_id] || 'the owner'} invites you again.`, yes: 'Leave list', no: 'Stay' })) { said(await D.leaveList(id)); renderAll(); } break; }
    case 'share-open': openShare('list', id); break;
    case 'inv-accept': { b.disabled = true; const r = await D.acceptInvite(id); said(r, r.ok ? 'Accepted. It is on your lists.' : ''); renderAll(); break; }
    case 'inv-decline': { const r = await D.declineInvite(id, false); said(r, r.ok ? 'Declined the invitation.' : ''); renderAll(); break; }
    case 'inv-block': if (await confirmDlg({ title: `Decline and block ${b.dataset.from}?`, body: 'You will not see invitations from them again.', yes: 'Decline and block', no: 'Cancel' })) { const r = await D.declineInvite(id, true); said(r, r.ok ? `Declined. Invitations from ${b.dataset.from} are blocked.` : ''); renderAll(); } break;
    case 'sh-remove': { const r = await D.removeMember(SH.kind, SH.id, b.dataset.pid); said(r, r.ok ? 'Removed.' : ''); loadPeople(); break; }
    case 'sh-revoke': { const r = await D.revokeInvite(id); said(r, r.ok ? 'Invitation revoked.' : SH && SH.owner ? '' : 'Only the owner revokes an invitation someone else sent.'); loadPeople(); break; }
    case 'tl-new': { const v = await promptDlg({ title: 'New tag list', label: 'Name', yes: 'Create' }); if (v) rOk(await D.createTagList(v), `Created ${v}.`); break; }
    case 'tl-menu': tlMenu(id); break;
    case 'tag-menu': tagMenu(id); break;
    case 'tag-add': { const l = D.tagLists[id]; if (!l) break; const v = await promptDlg({ title: `Add a tag to ${l.name}`, label: 'Tag name', yes: 'Add' }); if (!v) break; if (Object.values(D.tags).some(x => x.tag_list_id === id && x.name.toLowerCase() === v.toLowerCase())) { toast(`${l.name} already has ${v}.`); break; } const made = await D.ensureTags([{ list: id, name: v }]); if (made.length) toast(`Added ${v} to ${l.name}.`); renderTagGroups(); break; }
    case 'tl-fold': { TLW.fold.has(tid) ? TLW.fold.delete(tid) : TLW.fold.add(tid); renderMe(); const f = $(`[data-act="tl-fold"][data-tid="${tid}"]`); if (f) f.focus(); break; }
    case 'tl-shift': { const d = +b.dataset.d; TLW.off = d ? TLW.off + d : 0; renderMe(); const f = $(`[data-act="tl-shift"][data-d="${d}"]`); if (f) f.focus(); break; }
    case 'g-welcome': D.setPrefs({ welcomeVersion: 0, welcomeSeen: false }); welcome(); break;
    case 'cl-reset': { const g = D.cardLayout.group; D.setPrefs({ cardLayout: Object.assign(JSON.parse(JSON.stringify(C.CARD_LAYOUT_DEFAULTS)), { group: g }), cards: { mode: 'collapsed', flipped: [] } }); S.flip.clear(); renderBoard(); renderMe(); toast('Card layout reset. Tasks Grouping is kept as it was.'); break; }
    case 'wl-next': WL = 1; drawWelcome(true); break;
    case 'wl-back': WL = 0; drawWelcome(true); break;
    case 'wl-later': case 'wl-done': welcomeDone(); break;
    case 'wl-urg': welcomeDone(); openPage('pg-urgency'); break;
    case 'wl-cl': welcomeDone(); openPage('pg-cards'); break;
    case 'ntc': {
      const v = b.dataset.v, n = D.notices.find(x => x.id === id); if (!n) { unnote('n-ntc-' + id); break; }
      if (v === 'block' && !(await confirmDlg({ title: `Block ${n.inviter_name || 'them'}?`, body: `You leave “${n.target_name}” and will not see shares or invitations from ${n.inviter_name || 'them'} again.`, yes: 'Block', no: 'Cancel' }))) break;
      const r = await D.answerNotice(id, v); if (r.ok) { unnote('n-ntc-' + id); if (r.msg) toast(r.msg + '.'); else toast(`${n.target_name} is on your lists.`); } else said(r);
      renderAll(); break;
    }
    case 'inst-dismiss': store.set(INST_KEY, 'dismissed'); unnote('n-install'); break;
    case 'inst-android': await doInstall(); reMe(); break;
    default: break;
  }
}

/* ---------- start: splash, then the session, the gate and the board ---------- */
async function boot() {
  const r = await D.start();
  if (r.state === 'signedin') return afterSignIn();
  if (r.state === 'config') return openSignin({ msg: 'The app is not configured: ' + r.msg });
  if (r.state === 'unreachable') return openSignin({ k: 'unreachable', msg: r.msg });
  return openSignin({ msg: r.msg });
}
updateFades();
new ResizeObserver(dockSize).observe($('#dock'));
setPill();
runSplash();
boot();
</script>
