// Timeline (task links): one row per task. The picked tasks are the open ones that pass the filters and have a date in the
// window; their parent trees join them (C.timelineRows). A row shows the tree indent (a chevron folds a parent, this session
// only: st.tlCollapsed), the number and title, and a bar from Start (or the End day) to End in the quadrant's colour; a parent
// also gets a thin span over its whole tree. One SVG layer draws an arrow from each predecessor's bar end to the next task's bar
// start, red and dashed when the next one starts before the predecessor ends. Closed tasks in a tree are greyed. Geometry is
// in px from the day width st.tlDayW, measured once after a render (tlFit), so no row reads the layout.
const TL_ROW = 34;
function timelineHtml() {
  const t0 = performance.now();
  const mon = x => { const y = new Date(x); y.setHours(0, 0, 0, 0); y.setDate(y.getDate() - ((y.getDay() + 6) % 7)); return y; };
  if (!st.tlStart) st.tlStart = mon(TODAY);
  const days = st.tlWeeks * 7, start = st.tlStart, end = new Date(start.getTime() + days * DAY);
  const phone = matchMedia('(max-width:700px)').matches, nw = phone ? 132 : 248, dw = st.tlDayW || (phone ? 22 : 30), W = days * dw;
  const lx = linkIx();
  const base = all().filter(t => !t.doneAt && inList(t) && passFilters(t) && (t.start || t.deadline) && (t.start || t.deadline) < end && (t.deadline || t.start) >= start);
  const { rows, edges } = C.timelineRows(base, lx.ix, lx.by, { start, days, collapsed: st.tlCollapsed, cap: 5 });
  const today = Math.round((new Date(TODAY).setHours(0, 0, 0, 0) - start) / DAY);
  const dayAt = i => new Date(start.getTime() + i * DAY);
  const head = [...Array(days)].map((_, i) => { const x = dayAt(i), we = x.getDay() === 0 || x.getDay() === 6; return '<div class="tl-d' + (we ? ' we' : '') + (i === today ? ' td' : '') + '">' + x.getDate() + '</div>'; }).join('');
  const cols = [...Array(days)].map((_, i) => { const x = dayAt(i); return x.getDay() === 0 || x.getDay() === 6 ? '<i class="tl-we" style="left:' + i * dw + 'px;width:' + dw + 'px"></i>' : ''; }).join('') +
    (today >= 0 && today < days ? '<i class="tl-now" style="left:' + (today * dw + dw / 2) + 'px"></i>' : '');
  const clip = (a, b) => ({ a: Math.max(0, a), b: Math.min(days - 1, b) });
  const barHtml = r => {
    const t = r.t, title = esc(plain(t.title));
    let h = '';
    if (r.sum && r.kids) { const c = clip(r.sum.a, r.sum.b); if (c.a <= c.b) h += '<i class="tl-sum" style="left:' + c.a * dw + 'px;width:' + (c.b - c.a + 1) * dw + 'px"></i>'; }
    if (!r.bar) return h + (r.sum && r.kids ? '' : '<span class="tl-nd">no dates</span>');
    if (r.bar.b < 0) return h + '<button class="tl-off l" data-open="' + t.id + '" aria-label="' + title + ', ended before these weeks">‹ ' + fmtDay(t.deadline || t.start) + '</button>';
    if (r.bar.a > days - 1) return h + '<button class="tl-off r" data-open="' + t.id + '" aria-label="' + title + ', starts after these weeks">' + fmtDay(t.start || t.deadline) + ' ›</button>';
    const c = clip(r.bar.a, r.bar.b);
    return h + '<button class="tl-bar ' + t.q + (overdue(t) ? ' overdue' : '') + (c.a !== r.bar.a ? ' cut-l' : '') + (c.b !== r.bar.b ? ' cut-r' : '') + '" data-open="' + t.id + '" style="left:' + c.a * dw + 'px;width:' + (c.b - c.a + 1) * dw + 'px"' +
      ' aria-label="' + title + (t.start ? ', start ' + fmtDay(t.start) : '') + (t.deadline ? ', end ' + fmtDay(t.deadline) : '') + '"></button>';
  };
  const rowsHtml = rows.map(r => {
    const t = r.t;
    const chev = r.kids ? '<button class="tl-chev" data-tlcol="' + t.id + '" aria-expanded="' + !r.collapsed + '" aria-label="' + (r.collapsed ? 'Show' : 'Hide') + ' the ' + r.kids + ' subtasks of ' + esc(plain(t.title)) + '">' + (r.collapsed ? I.chevR : I.chevD) + '</button>' : '<span class="tl-chev-sp"></span>';
    return '<div class="tl-row ' + t.q + (r.closed ? ' closed' : '') + (r.kids ? ' parent' : '') + '" data-tl="' + t.id + '"><div class="tl-name" style="--ind:' + r.depth + '">' + chev +
      '<button class="tl-t" data-open="' + t.id + '"><span class="k">' + ref(t) + '</span> ' + esc(plain(t.title)) + '</button></div><div class="tl-track">' + barHtml(r) + '</div></div>';
  }).join('');

  const src = drawn(from), i = src.indexOf(t);

async function ensureTags(items) {

    const own = Object.values(TAG).find(x => x.tag_list_id === tl && x.name.toLowerCase() === name.toLowerCase());
    if (own) { out.push(own.id); continue; }

    let r = await rest('POST', 'tags', { tag_list_id: tl, name, sort }, { Prefer: 'return=representation' });

  if (r.ok) { const ev = r.json.find(e => e.diff && e.diff.status && e.diff.status.new === t.status); if (ev && C.STATUSES.includes(ev.diff.status.old) && !C.CLOSED.includes(ev.diff.status.old)) prev = ev.diff.status.old; }
  const u = edit(t, x => { x.status = prev; });

}

function dialogShell(html, opener) {

// round 3, adjustment 8: Weekly review (a rail view). A strip of ISO weeks under an orange week line (--week), this week marked,

const RV_KIND = { done: 'Done', cancelled: 'Cancelled', overdue: 'Overdue', due: 'Due' };

const longDay = ms => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

function rvInit() {

}
// round 3 P1, F3: test lists (C.isTestList) never show in the review; F5: cancelled tasks are listed by when they were cancelled
const rvShownLists = () => LISTS.filter(l => !C.isTestList(LIST[l]));
function reviewData() {
  rvInit();
  const tasks = all().filter(t => !C.isTestList(LIST[t.list]) && (!st.rvLists.size || st.rvLists.has(t.list)));
  loadCancelTimes(tasks).then(changed => { if (changed && st.view === 'review') render(); });
  const entries = C.reviewEntries(tasks, st.rvSel, TODAY.getTime(), CANCEL_AT);

// F5: when each cancelled task was cancelled, from its item_events (C.cancelTimes); read once per task and close time (a task
// cancelled again is read again). A failed read is tried on the next render; until then the row uses doneAt
const CANCEL_AT = {}, CANCEL_KEY = {};
async function loadCancelTimes(tasks) {
  const want = (tasks || []).filter(t => t.status === 'cancelled' && t.doneAt && CANCEL_KEY[t.id] !== t.doneAt.getTime());
  if (!want.length) return false;
  want.forEach(t => { CANCEL_KEY[t.id] = t.doneAt.getTime(); });
  for (let i = 0; i < want.length; i += 80) {
    const ids = want.slice(i, i + 80).map(t => t.id);
    const r = await getAll('item_events?select=item_id,at,status:diff->status&item_id=in.(' + ids.join(',') + ')&diff->status->>new=eq.cancelled');
    if (!r.ok) { want.slice(i).forEach(t => { delete CANCEL_KEY[t.id]; }); return i > 0; }
    Object.assign(CANCEL_AT, C.cancelTimes(r.json));
  }
  return true;
}
// one task row: number, title, tags, what happened and when; a button that opens the task, a plain row in the export
function rvRow(e, exp) {

    '<span class="rv-k">' + RV_KIND[e.kind] + (e.late && e.kind !== 'overdue' ? ', late' : '') + ' <span class="n">' + shortDay(e.at) + '</span></span>';

    (g.lists.map(l => '<div class="rvl"><h4>' + esc(label(l.list)) + ' <span class="n">' + l.rows.length + '</span></h4>' + l.rows.map(e => rvRow(e, exp)).join('') + '</div>').join('') || '<p class="rv-none">Nothing here</p>') + '</section>').join('') + '</div>';

function reviewHtml() {

// round 3, adjustment 9: KPI (round 4: named Visuals, above the tasks, open by default), a collapsible section with its own list chips (archived lists too). Two groups:
// Selected period (the picked weeks, up to now) and Overall (the first item's day to now). Per group: open items per quadrant
// over time (stacked area), the period's items per quadrant with closed ones as a lighter shade (donut), and how they ended
// (Closed, Archived, Deleted). The chosen lists' items (deleted ones too) and their item_events are read once per list set and
// kept for the session (KPI_CACHE); the history is rebuilt backwards from the diffs (C.kpiHistory). Hover: a <title> on every
// mark (also in the export), plus the donut's centre in the page.
let KPI_LISTS = null; // every list I can read, archived ones too: [{ id, name, archived_at }]
const KPI_CACHE = {}; // sorted list ids -> { status: 'loading' | 'ok' | 'error', hists, ms, items, events, error }
const KPI_ITEM_COLS = 'id,list_id,quadrant,status,due_at,urgent_pin,category,deleted_at,created_at';
const KPI_EVENT_COLS = 'id,item_id,at,' + C.KPI_COLUMNS.map(k => k + ':diff->' + k).join(',') + ',items!inner(list_id)';
let KPI_RPC = null; // db/013 kpi_events: null = not tried yet, false = not there (404), true = in use
const KPI_WAVE = 4; // REST pages read at once
let kpiAuto = false; // round 4: a read started by opening the Review is running
// paged GET like getAll, KPI_WAVE pages at a time (order=id), until a short page
async function getAllWaves(path) {
  const out = [];
  for (let off = 0; ; off += KPI_WAVE * C.PAGE) {
    const rs = await Promise.all([...Array(KPI_WAVE)].map((_, i) => rest('GET', path + '&' + C.pageParams(off + i * C.PAGE))));
    for (const r of rs) { if (!r.ok) return r; out.push(...r.json); if (r.json.length < C.PAGE) return { ok: true, json: out }; }
  }
}
const kpiIds = () => (KPI_LISTS || []).map(l => l.id).filter(id => !st.kpiLists.size || st.kpiLists.has(id)).sort();
const kpiArchived = () => Object.fromEntries((KPI_LISTS || []).filter(l => l.archived_at).map(l => [l.id, Date.parse(l.archived_at)]));
async function kpiLoad() {
  rvInit();
  if (!KPI_LISTS) {
    const r = await getAll('lists?select=id,slug,name,archived_at');
    KPI_LISTS = r.ok ? r.json.filter(l => !C.isTestList(l)).sort((a, b) => !!a.archived_at - !!b.archived_at || (LISTS.indexOf(a.id) + 1 || 1e9) - (LISTS.indexOf(b.id) + 1 || 1e9) || a.name.localeCompare(b.name)) : [];
  }
  const ids = kpiIds(), key = ids.join();
  if (KPI_CACHE[key] && KPI_CACHE[key].status === 'error') delete KPI_CACHE[key]; // a failed read is tried again
  if (!ids.length || KPI_CACHE[key]) return render();
  const c = KPI_CACHE[key] = { status: 'loading' };
  render();
  const t0 = performance.now(), within = 'in.(' + ids.join(',') + ')';
  performance.mark('td:kpi-start');
  // db/013 kpi_events: one jsonb answer; without it (404), REST pages, KPI_WAVE at a time
  let items = null, events = null, via = 'rest';
  if (KPI_RPC !== false) {
    const r = await rpc('kpi_events', { p_lists: ids });
    if (r.ok && r.json && Array.isArray(r.json.items)) { items = { ok: true, json: r.json.items }; events = { ok: true, json: r.json.events || [] }; via = 'rpc'; KPI_RPC = true; }
    else if (r.status === 404) KPI_RPC = false;
    else { Object.assign(c, { status: 'error', error: r.err.message }); return render(); }
  }
  if (!items) [items, events] = await Promise.all([getAllWaves('items?select=' + KPI_ITEM_COLS + '&list_id=' + within),
    getAllWaves('item_events?select=' + KPI_EVENT_COLS + '&items.list_id=' + within + '&action=neq.create')]);
  if (!items.ok || !events.ok) { Object.assign(c, { status: 'error', error: (items.err || events.err).message }); return render(); }
  performance.mark('td:kpi-fetched');
  Object.assign(c, { hists: C.kpiHistory(items.json, events.json), items: items.json.length, events: events.json.length, via, status: 'ok' });
  c.ms = Math.round(performance.now() - t0);
  performance.mark('td:kpi-ready');
  render();
}
function kpiHtml(exp) {

  const c = KPI_CACHE[kpiIds().join()], L = KPI_LISTS || [], arch = L.filter(l => l.archived_at), showArch = !!st.kpiArch || arch.some(l => st.kpiLists.has(l.id));
  // archived lists (their tasks count in All lists) fold behind one chip
  const kpiChip = ls => ls.map(l => '<button type="button" data-kpil="' + esc(l.id) + '" aria-pressed="' + st.kpiLists.has(l.id) + '"' + (l.archived_at ? ' class="arch" title="Archived ' + fmtDay(new Date(l.archived_at)) + '"' : '') + '>' + esc(l.name) + '</button>').join('');
  const chips = exp ? '<p class="rv-meta">Lists: ' + esc(st.kpiLists.size ? (KPI_LISTS || []).filter(l => st.kpiLists.has(l.id)).map(l => l.name).join(', ') : 'all lists, archived ones too') + '</p>'
    : '<div class="rv-lists kpi-lists" role="group" aria-label="Lists in the Visuals"><button type="button" data-kpil="all" aria-pressed="' + !st.kpiLists.size + '">All lists</button>' +
      kpiChip(L.filter(l => !l.archived_at)) + (arch.length ? '<button type="button" class="quiet" id="kpi-arch" aria-expanded="' + showArch + '">' + (showArch ? 'Hide archived lists' : 'Archived lists (' + arch.length + ')') + '</button>' + (showArch ? kpiChip(arch) : '') : '') + '</div>';
  const body = !KPI_LISTS || !c || c.status === 'loading' ? '<p class="kpi-wait">Reading the history…</p>'

  return exp ? '<section class="kpi"><h2>Visuals</h2>' + chips + body + '</section>' : '<details class="kpi" id="kpi" open' + (c && c.status === 'ok' ? ' data-read="' + c.ms + ',' + c.items + ',' + c.events + ',' + KPI_LISTS.length + ',' + c.via + '"' : '') + '><summary>Visuals</summary>' + chips + body + '</details>';

// round 3 P1, U11: one block, minimal. A Period | All time switch (st.kpiRange) with the dates beside it, or only Period and
// "All time = the same days" when both hold the same days; then three charts, each under its question: open tasks per quadrant
// over time (thin lines, end labels, kpiLines), where the work is (a bar per quadrant, kpiQuads), how tasks left the board

function kpiGroups(c, exp) {
  const now = TODAY.getTime(), o = { settings, archived: kpiArchived() }, p = C.reviewPeriod(st.rvSel);
  const per = p && p.from < now ? { from: p.from, to: Math.min(p.to, now) } : null, whole = C.kpiOverall(c.hists, now);
  const same = !!per && !!whole && whole.from >= per.from;

  const r = pick === 'all' ? whole : per;
  const seg = same ? '<span class="kpi-same">All time = the same days</span>' : !per || !whole ? '' :
    '<span class="kpi-seg" role="group" aria-label="Range">' + [['period', 'Period'], ['all', 'All time']].map(([k, n]) => exp ? (k === pick ? '<b>' + n + '</b>' : '') :
      '<button type="button" data-kpir="' + k + '" aria-pressed="' + (k === pick) + '">' + n + '</button>').join('') + '</span>';
  const head = '<div class="kpi-top">' + seg + (r ? '<span class="kpi-per">' + spanText(r.from, r.to) + '</span>' : '') + '</div>';
  if (!r) return head + '<p class="kpi-wait">' + (!whole ? 'No items in these lists.' : p ? 'These weeks have not started yet.' : 'Pick a week.') + '</p>';
  const fig = (cls, q, chart) => '<figure class="kpi-f ' + cls + '"><figcaption class="kpi-qn">' + q + '</figcaption>' + chart + '</figure>';
  return head + '<section class="kpi-g" data-kpi="' + pick + '"><div class="kpi-c">' +
    fig('kpi-area', 'Is my open work growing, and where?', kpiLines(C.kpiSeries(c.hists, r.from, r.to, o))) +

const KW = 520, KH = 160, KP = { l: 4, r: 86, t: 14, b: 22 };
const f1 = v => (Math.round(v * 10) / 10).toString();
const hourText = ms => shortDay(ms) + ' ' + String(new Date(ms).getHours()).padStart(2, '0') + ':00';
// open tasks per quadrant over time: four 2 px lines (steps and dots with 3 points or fewer), a faint baseline, the top value,
// unique date ticks (C.kpiTicks), end labels pushed apart, and a hover column per point with its numbers
function kpiLines(s) {
  const P = s.points, n = P.length, top = Math.max(2, ...P.flatMap(pt => C.QS.map(q => pt[q])));
  const x = i => KP.l + (n < 2 ? (KW - KP.l - KP.r) / 2 : i * (KW - KP.l - KP.r) / (n - 1)), y = v => KP.t + (KH - KP.t - KP.b) * (1 - v / top);
  const steps = n <= 3;
  const line = q => {
    let d = 'M' + f1(x(0)) + ',' + f1(y(P[0][q]));
    for (let i = 1; i < n; i++) d += steps ? 'H' + f1(x(i)) + 'V' + f1(y(P[i][q])) : 'L' + f1(x(i)) + ',' + f1(y(P[i][q]));
    return '<path class="kln" data-q="' + q + '" d="' + d + '"/>' + (steps ? P.map((pt, i) => '<circle class="kdt" data-q="' + q + '" cx="' + f1(x(i)) + '" cy="' + f1(y(pt[q])) + '" r="4"/>').join('') : '');
  };
  const base = '<line class="kb0" x1="' + KP.l + '" x2="' + (KW - KP.r) + '" y1="' + f1(y(0)) + '" y2="' + f1(y(0)) + '"/><text class="kt" x="' + KP.l + '" y="' + (KP.t - 4) + '">' + top + '</text>';
  const tk = C.kpiTicks(P.map(pt => pt.at));
  const xs = tk.idx.map(i => '<text class="kt kx" x="' + f1(x(i)) + '" y="' + (KH - 6) + '" text-anchor="' + (n < 2 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + (tk.kind === 'hour' ? hourText(P[i].at) : shortDay(P[i].at)) + '</text>').join('');
  const last = n - 1, lab = C.QS.map(q => ({ q, v: P[last][q], y: y(P[last][q]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < lab.length; i++) lab[i].y = Math.max(lab[i].y, lab[i - 1].y + 13);
  const over = Math.max(0, lab[lab.length - 1].y - (KH - KP.b)); lab.forEach(l => { l.y -= over; });
  const labels = lab.map(l => '<line class="kln" data-q="' + l.q + '" x1="' + (KW - KP.r + 6) + '" x2="' + (KW - KP.r + 14) + '" y1="' + f1(l.y) + '" y2="' + f1(l.y) + '"/>' +
    '<text class="kl" x="' + (KW - KP.r + 19) + '" y="' + f1(l.y + 3.5) + '">' + QN[l.q] + ' <tspan class="kv">' + l.v + '</tspan></text>').join('');
  const w = n < 2 ? KW - KP.l - KP.r : (KW - KP.l - KP.r) / (n - 1);
  const hover = P.map((pt, i) => { const x0 = Math.max(KP.l, x(i) - w / 2); return '<rect class="kh" x="' + f1(x0) + '" y="' + KP.t + '" width="' + f1(Math.min(w, KW - KP.r - x0)) + '" height="' + (KH - KP.t - KP.b) + '"><title>' +
    (s.step === 7 ? 'Week to ' : '') + longDay(pt.at) + ': ' + C.QS.map(q => QN[q] + ' ' + pt[q]).join(', ') + '</title></rect>'; }).join('');
  return '<svg viewBox="0 0 ' + KW + ' ' + KH + '" role="img" aria-label="Open tasks by quadrant over time; at the end: ' + C.QS.map(q => QN[q] + ' ' + P[last][q]).join(', ') + '">' +
    base + C.QS.map(line).join('') + xs + labels + hover + '</svg>';
}
// where the work is: one row per quadrant, "Plan · 22 open · 1 closed · 48%" (the share of all the period's tasks) over a bar,
// open solid and closed the same hue lighter, scaled to the largest quadrant; the row's title has the exact numbers
function kpiQuads(p) {
  const max = Math.max(1, ...C.QS.map(q => p[q].open + p[q].closed)), pct = n => p.total ? Math.round(100 * n / p.total) : 0, w = v => f1(100 * v / max) + '%';
  return '<div class="kpi-qs" role="list" aria-label="Tasks by quadrant">' + C.QS.map(q => {
    const v = p[q], n = v.open + v.closed;
    return '<div class="kq" role="listitem" data-q="' + q + '" data-n="' + n + '" data-pct="' + pct(n) + '" title="' + esc(QN[q] + ': ' + v.open + ' open, ' + v.closed + ' closed; ' + n + ' of ' + p.total + ' (' + pct(n) + '%)') + '">' +
      '<span class="kq-l"><b>' + QN[q] + '</b> · <span class="kv">' + v.open + '</span> open · <span class="kv">' + v.closed + '</span> closed · <span class="kv">' + pct(n) + '%</span></span>' +
      '<span class="kq-b">' + (v.open ? '<i class="o" style="width:' + w(v.open) + '"></i>' : '') + (v.closed ? '<i class="c" style="width:' + w(v.closed) + '"></i>' : '') + '</span></div>';

// how the period's tasks left the board: three numbers in a row, one thin bar of their shares, still open as a caption
function kpiLeft(c) {
  const parts = [['closed', 'Closed', c.closed], ['archived', 'Archived', c.archived], ['deleted', 'Deleted', c.deleted]], sum = c.closed + c.archived + c.deleted;
  return '<div class="kpi-left"><p class="kl3">' + parts.map(([k, name, v]) => '<span class="kl-n" data-k="' + k + '" title="' + name + ': ' + v + '"><i class="sw"></i>' + name + ' <span class="kv">' + v + '</span></span>').join('') + '</p>' +
    '<span class="kl-bar" role="img" aria-label="Closed ' + c.closed + ', archived ' + c.archived + ', deleted ' + c.deleted + '">' +
    parts.filter(x => x[2]).map(([k, name, v]) => '<i data-k="' + k + '" style="width:' + f1(100 * v / sum) + '%" title="' + name + ': ' + v + '"></i>').join('') + '</span>' +

// Download: the review as shown (weeks, lists, groups) and the KPI as one HTML file with its own light and print styles, no script

    await kpiLoad();
    while ((KPI_CACHE[kpiIds().join()] || {}).status === 'loading') await new Promise(r => setTimeout(r, 100));
  }
  await loadCancelTimes(all().filter(t => !C.isTestList(LIST[t.list])));
  const d = reviewData(), lists = st.rvLists.size ? [...st.rvLists].map(label).join(', ') : 'all lists';
  const now = new Date(), stamp = longDay(now.getTime()) + ' ' + ymd(now).slice(11);

// welcome v3 (2026-10-29): the fields of Urgency settings and Card layout are built and read here only, for both windows and
// for the welcome card, so the two never drift. p prefixes the ids (the welcome uses 'wl-', a window may be open over it);
// reads go by data attributes and radio names inside root (each form is its own radio scope), never by id.
function urgencyFields(p) {
  const s = settings, D = C.SETTINGS_DEFAULTS;
  const f = (k, label, attrs, val, hint) => '<label>' + label + '<input id="' + p + 's-' + k + '" data-u="' + k + '" type="number" ' + attrs + ' value="' + val + '" aria-describedby="' + p + 's-' + k + '-h"></label>' +
    '<p class="s-hint" id="' + p + 's-' + k + '-h">' + hint + '</p>';
  return f('win', 'Urgency window, days', 'min="1" max="30"', s.windowDays, 'A task without a fixed quadrant moves to Do when its end is this close. 1-30, default ' + D.windowDays + '.') +
    f('th', 'Due soon, % of the window', 'min="10" max="90" step="5"', s.threshold, 'A card is marked due soon when less than this share of the window is left. 10-90, default ' + D.threshold + '.') +
    f('lim', 'Do limit', 'min="0" max="50"', s.doLimit, 'The Do count turns red above this number. 0 turns it off; default ' + D.doLimit + '.');
}
// out-of-range values fall back to the default, as they always did
function readUrgency(root) {
  const D = C.SETTINGS_DEFAULTS;
  const num = (k, lo, hi, dflt) => { const v = Number(root.querySelector('[data-u=' + k + ']').value); return v >= lo && v <= hi ? v : dflt; };
  return C.readSettings({ threshold: num('th', 10, 90, D.threshold), windowDays: num('win', 1, 30, D.windowDays), doLimit: num('lim', 0, 50, D.doLimit) });
}
const CL_NAMES = { description: 'Description', number: 'Task number', arrow: 'Expand arrow', end: 'End date', created: 'Created date', creator: 'Who created it', source: 'Source (category, Sources)',
  group: 'Tasks Grouping', waiting: 'Waiting for (open predecessors)', progress: 'Subtask progress' };
const clRadio = (nm, v, label, on) => '<label class="cb"><input type="radio" name="' + nm + '" value="' + v + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
// order (2026-10-29, Maksym): Moving between tasks, Cards open (both one row of options), Shorten, A card shows, Tags
function cardLayoutFields(p) {

    '<p class="s-hint">How the task window shows the previous and next task. Applies the next time a task opens.</p></fieldset>' +
    '<fieldset class="cl-mode cl-inline"><legend>Cards open</legend>' + clRadio('cl-mode', 'collapsed', 'Collapsed', st.cardMode === 'collapsed') + clRadio('cl-mode', 'expanded', 'Expanded', st.cardMode === 'expanded') + '</fieldset>' +
    '<label>Shorten descriptions longer than, characters<input id="' + p + 'cl-auto" data-cl-auto type="number" min="0" max="5000" value="' + L.autoCollapse + '" aria-describedby="' + p + 'cl-auto-h"></label>' +
    '<p class="s-hint" id="' + p + 'cl-auto-h">An open card shows this many characters of the description, then Show more. 0 shows the whole description; default ' + D.autoCollapse + '.</p>' +

    '<fieldset><legend>Tags</legend>' + clRadio('cl-tags', 'all', 'All tags', L.tags === 'all') + clRadio('cl-tags', 'lists', 'Only from these tag lists', L.tags === 'lists') +
    '<div class="cl-lists">' + (lists.length ? lists.map(l => '<label class="cb"><input type="checkbox" data-cl-list="' + esc(l.id) + '"' + (L.tagLists.includes(l.id) ? ' checked' : '') + '> ' + esc(l.name) + (l.owner_id !== me.id ? ' <span class="n">' + esc(personName(l.owner_id)) + '</span>' : '') + '</label>').join('') : '<p class="s-hint">No tag lists yet.</p>') + '</div>' +
    clRadio('cl-tags', 'off', 'No tags', L.tags === 'off') + '</fieldset>';

// the tag-list ticks follow the Tags choice; Tasks Grouping asks first (C.groupingNotice), Cancel or Escape puts the tick back.
// Returns reset(): the defaults into the form (the window's Reset)
function wireCardLayout(root) {
  const D = C.CARD_LAYOUT_DEFAULTS, q = s => root.querySelector(s);
  const syncLists = () => { const on = q('input[name=cl-tags]:checked').value === 'lists'; root.querySelectorAll('[data-cl-list]').forEach(b => { b.disabled = !on; }); };
  root.querySelectorAll('input[name=cl-tags]').forEach(r => r.onchange = syncLists); syncLists();
  const grp = q('[data-cl=group]');
  const askGrouping = was => {
    const n = C.groupingNotice(grp.checked);
    const c = dialogShell('<form method="dialog" class="grp-ask"><strong>' + esc(n.title) + '</strong><p>' + esc(n.text) + '</p><div class="actions"><span class="sp"></span><button value="cancel" id="grp-cancel">Cancel</button><button id="grp-ok" value="ok">Apply</button></div></form>', grp);
    let ok = false;
    c.querySelector('#grp-ok').onclick = () => { ok = true; };
    c.addEventListener('close', () => { if (!ok) grp.checked = was; });
    c.querySelector('#grp-cancel').focus();
  };
  grp.onchange = () => askGrouping(!grp.checked);
  return () => {
    const was = grp.checked;
    C.CARD_FIELDS.forEach(k => { q('[data-cl="' + k + '"]').checked = D[k]; });
    if (grp.checked !== was) askGrouping(was);
    q('[data-cl-auto]').value = D.autoCollapse; q('input[name=s-switch][value=standard]').checked = true; q('input[name=cl-tags][value=all]').checked = true; q('input[name=cl-mode][value=collapsed]').checked = true; syncLists();
  };
}
function readCardLayoutForm(root) {
  const D = C.CARD_LAYOUT_DEFAULTS, q = s => root.querySelector(s);
  const raw = { tags: q('input[name=cl-tags]:checked').value, tagLists: [...root.querySelectorAll('[data-cl-list]:checked')].map(b => b.dataset.clList) };
  C.CARD_FIELDS.forEach(k => { raw[k] = q('[data-cl="' + k + '"]').checked; });
  const n = Number(q('[data-cl-auto]').value); raw.autoCollapse = Number.isInteger(n) && n >= 0 && n <= 5000 ? n : D.autoCollapse;
  const sw = q('input[name=s-switch]:checked');
  return { layout: C.readCardLayout(raw, Object.keys(TAG_LISTS)), mode: q('input[name=cl-mode]:checked').value, switcher: sw && C.TASK_SWITCHERS.includes(sw.value) ? sw.value : taskSwitcher };
}
// prefs.cardLayout, cards.mode and prefs.taskSwitcher; the caller's render() saves the preferences
function applyCardLayout(v) {
  cardLayout = v.layout;
  if (v.mode !== st.cardMode) { st.cardMode = v.mode; st.flip.clear(); }
  if (v.switcher !== taskSwitcher) { taskSwitcher = v.switcher; savePrefsSoon(); }
}

// settings are saved per person in the preferences row; display name and time zone are the profile's own columns
// round 3: two windows. General (people): display name, time zone. Urgency: window, due soon %, Do limit (SETTINGS_DEFAULTS).
function openSettings(kind) {
  const browserTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
  const zones = (() => { try { return Intl.supportedValuesOf('timeZone'); } catch (e) { return []; } })();
  const human = me.kind === 'human', general = kind === 'general' && human;
  const D = C.SETTINGS_DEFAULTS;
  const dlg = dialogShell('<form method="dialog" class="settings"><strong>' + (general ? 'General settings' : 'Urgency settings') + '</strong>' +
    (general ? '<label>Display name<input id="s-name" maxlength="60" autocomplete="name" value="' + esc(me.display_name) + '"></label><div class="err" id="s-name-e" aria-live="polite"></div>' +
      '<label>Time zone<input id="s-tz" list="s-tzs" autocomplete="off" spellcheck="false" value="' + esc(me.timezone || browserTz) + '"></label><datalist id="s-tzs">' + zones.map(z => '<option value="' + esc(z) + '">').join('') + '</datalist><div class="err" id="s-tz-e" aria-live="polite"></div>' +
      '<div class="s-row"><span>Welcome card</span><button type="button" id="s-welcome">Show again</button></div>'
    : urgencyFields('')) +
    '<div class="actions"><button value="cancel">Cancel</button><button id="s-save" value="save">Save</button></div></form>', '#profile');
  const again = dlg.querySelector('#s-welcome');
  // after the window's own close handler (render, focus back to the menu), so the note keeps the focus
  if (again) again.onclick = () => { welcomeSeen = false; welcomeVersion = 0; dlg.addEventListener('close', () => setTimeout(showWelcome)); dlg.close(); };
  dlg.querySelector('#s-save').onclick = e => {
    const patch = {};
    if (!general) { settings = readUrgency(dlg); return toast('Urgency settings saved'); }
    const name = dlg.querySelector('#s-name').value.replace(/[\u0000-\u001f\u007f]/g, '').trim(), tz = dlg.querySelector('#s-tz').value.trim();
    if (!name) { e.preventDefault(); dlg.querySelector('#s-name-e').textContent = 'Enter a name'; dlg.querySelector('#s-name').focus(); return; }
    if (tz && zones.length && !zones.includes(tz) && tz !== 'UTC') { e.preventDefault(); dlg.querySelector('#s-tz-e').textContent = 'Pick a time zone from the list'; dlg.querySelector('#s-tz').focus(); return; }
    if (name !== me.display_name) patch.display_name = name;
    if (tz && tz !== me.timezone) patch.timezone = tz;
    if (!Object.keys(patch).length) return toast('Settings saved');
    rest('PATCH', 'profiles?id=eq.' + me.id, patch, { Prefer: 'return=representation' }).then(r => {
      if (r.ok && r.json.length) { Object.assign(me, patch); NAMES[me.id] = me.display_name; toast('Settings saved'); render(); }
      else toast('Settings saved; name and time zone not: ' + (r.ok ? 'not allowed' : r.err.message));
    });
  };
}

// round 3, adjustment 12, then 2026-10-29 (version 3): a welcome card once per person and version (prefs.welcomeVersion <
// C.WELCOME_VERSION), under the profile menu, which it highlights. One long card: what is new in the task window, then the
// Urgency and Card layout forms (the same builders as the two windows, prefilled), then Later and Save. Save saves both as
// the windows' Save would; Later, ✕ and Escape save nothing. Either way it is marked seen. Not a <dialog> and no role="dialog":
// it is not modal (an open dialog holds back renders after a poll, and this card may stay open while the person works).
// Its body scrolls inside the card; the action row stays in view.
let welcomeOn = false;
function showWelcome() {

  el.innerHTML = '<button type="button" id="wl-x" class="wl-x" aria-label="Close the welcome card">' + I.x + '</button>' +
    '<form id="wl-form" class="wl-form" novalidate><div class="wl-body">' +
    '<p class="wl-step">New in the task window</p><h2 id="wl-h">Set up your board</h2>' +
    '<div class="wl-lead"><p>Move between tasks without closing the task window:</p>' +
    '<ul><li>Click beside the window, or press <kbd>←</kbd> or <kbd>→</kbd>, for the previous or next task: Do, then Plan, Delegate, Eliminate.</li>' +
    '<li>Click above or below the window to close it. Unsaved changes ask first.</li></ul>' +
    '<p>The two cards below set how your board works. Change what you like, then Save. Both stay in the profile menu.</p></div>' +
    '<section class="wl-card" data-wl="urgency" aria-labelledby="wl-u-h"><h3 id="wl-u-h">Urgency</h3><p class="wl-sub">When tasks move up to Do and stand out.</p>' + urgencyFields('wl-') + '</section>' +
    '<section class="wl-card" data-wl="cardlayout" aria-labelledby="wl-c-h"><h3 id="wl-c-h">Card layout</h3><p class="wl-sub">How cards look and how the task window moves.</p>' + cardLayoutFields('wl-') + '</section>' +
    '</div><div class="wl-foot"><span class="sp"></span><button type="button" id="wl-later">Later</button><button type="submit" class="wl-pri" id="wl-save">Save</button></div></form>';
  document.body.append(el);
  welcomeOn = true;
  const form = el.querySelector('#wl-form');
  wireCardLayout(form);
  // seen: this version (welcomeVersion), and welcomeSeen for clients that only know that key; render() saves the preferences
  const done = () => { el.remove(); welcomeOn = false; welcomeSeen = true; welcomeVersion = C.WELCOME_VERSION; removeEventListener('resize', placeWelcome); render(); savePrefsSoon(); document.getElementById('profile')?.focus(); };
  form.onsubmit = e => {
    e.preventDefault();

  addEventListener('resize', placeWelcome);

}
function placeWelcome() {
  const el = document.getElementById('welcome'), b = document.getElementById('profile');
  if (!el || !b) return;
  const r = b.getBoundingClientRect(), top = Math.round(r.bottom + 10);
  el.style.top = top + 'px';
  el.style.right = Math.max(8, Math.round(innerWidth - r.right)) + 'px';
  // the card ends above the bottom of the screen; its body scrolls (.wl-body), the pointer above it and the action row stay
  el.style.maxHeight = Math.max(240, innerHeight - top - 8) + 'px';
}

// round 3, adjustment 3: the note of a first share (shared_notices, db/012). Someone shared a list or tags with me and I joined
// without Accept: Keep (marks it seen), Leave, or Block (leaves everything that person joined me to this way, blocks them).
// Not a <dialog>, like the welcome: polls keep rendering under it. Drawn again only when the open notes change.
let noticesKey = null;
function drawNotices() {
  const open = session && !boot.gate && me && me.kind === 'human' ? NOTICES : [];
  const key = open.map(n => n.id).join();
  let el = document.getElementById('notices');
  if (key === noticesKey && !!el === !!open.length) return;
  noticesKey = key;
  if (!open.length) { el?.remove(); return; }
  if (!el) { el = document.createElement('aside'); el.id = 'notices'; el.className = 'notices'; el.setAttribute('aria-label', 'Shared with you'); document.body.append(el); }
  el.innerHTML = open.map(n => '<div class="ntc" role="status" data-notice="' + esc(n.id) + '"><p>' + esc(C.noticeText(n)) + '</p><div class="ntc-b">' +
    '<button type="button" class="quiet danger" data-ntc="block">Block</button><button type="button" class="quiet" data-ntc="leave">Leave</button><button type="button" data-ntc="seen">Keep</button></div></div>').join('');
  el.querySelectorAll('[data-ntc]').forEach(b => b.onclick = () => answerNotice(b.closest('[data-notice]').dataset.notice, b.dataset.ntc));
}
async function answerNotice(id, action) {
  const n = NOTICES.find(x => x.id === id); if (!n) return;
  const go = async () => {
    const r = await rpc('answer_shared_notice', { p_notice: id, p_action: action });
    if (!r.ok) return toast(r.err.message);
    NOTICES = NOTICES.filter(x => x.id !== id && !(action === 'block' && x.invited_by === n.invited_by));
    drawNotices();
    if (action === 'seen') return;
    await afterMembership(action === 'block' ? 'Blocked ' + n.inviter_name + '. You left what they shared with you.' : 'Left “' + n.target_name + '”');
  };
  if (action === 'block') confirmAsk('Block ' + n.inviter_name + '? You leave everything ' + n.inviter_name + ' shared with you without an invitation, and get no more shares from them.', 'Block', go, '#profile');
  else go();
}

// New list: rpc/create_list_row (db/012), private unless "Share with the household" (household members only, D-d of the multi-user
// plan). The database makes the slug (ASCII letters and digits of the name, else list-<6 hex>, -2, -3 … on a clash) and returns
// the row. Round 3: Create is off while it runs, and the new list is put in locally from the RPC's answer and selected at once (no
// reload of lists, items or item_tags: an empty list has none; the next poll reconciles). A name I already use: "You already have
// a list named X"; an archived one offers Restore or "X (2)".
function openNewList() {
  const hh = !!me.is_household;
  const dlg = dialogShell('<form method="dialog"><strong>New list</strong><label>Name<input id="nl-name" maxlength="60" autocomplete="off"></label><div class="err" id="nl-e" aria-live="polite"></div><div class="actions nl-x" id="nl-x" hidden></div>' +
    (hh ? '<label class="cb"><input id="nl-shared" type="checkbox" checked> Share with the household and the HomeOS agent</label>' : '<p class="sh-note">Only you see it until you share it (list menu, Share).</p>') +
    '<div class="actions"><button value="cancel">Cancel</button><button id="nl-go" value="create">Create</button></div></form>', '#newlist');
  const name = dlg.querySelector('#nl-name'), err = dlg.querySelector('#nl-e'), go = dlg.querySelector('#nl-go'), x = dlg.querySelector('#nl-x');
  // my archived lists, read while the person types (they are not in LIST)
  let archived = [];
  const readArchived = () => rest('GET', 'lists?select=id,name,owner_id,archived_at&archived_at=not.is.null&owner_id=eq.' + me.id).then(r => { if (r.ok) archived = r.json; return r; });
  const pending = readArchived();
  const say = (text, actions) => {
    err.textContent = text; x.innerHTML = ''; x.hidden = !actions;
    (actions || []).forEach(([label, fn]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; x.append(b); });
  };
  name.focus(); name.oninput = () => say('');
  const mineNow = () => Object.values(LIST).concat(HIDDEN_LISTS, archived);
  const create = async n => {
    const body = { p_name: n, p_shared: hh && dlg.querySelector('#nl-shared').checked };
    const r = await rest('POST', 'rpc/create_list_row', body);
    // a same-name list the page did not know about (another tab made it): look again, so the message below can name it
    if (!r.ok && r.err.kind === 'duplicate') { await readArchived(); await refreshMeta(); }
    performance.mark('td:list-rpc');
    if (!r.ok) return r;
    const l = C.createdList(r.json, { name: n, slug: null, ownerId: me.id, sort: Math.max(0, ...Object.values(LIST).filter(y => y.owner_id === me.id).map(y => y.sort || 0)) + 1 });
    if (!l) return { ok: false, err: { message: 'The list was made, but the answer was not understood. Reload the page.' } };
    LIST[l.id] = l; ROLE[l.id] = 'owner';
    if (!LISTS.includes(l.id)) LISTS.push(l.id);
    st.list = l.id; st.expanded = null; if (st.view !== 'matrix' && st.view !== 'archive') st.view = 'matrix';
    return { ok: true, list: l };
  };
  const run = async (n, ignoreArchived) => {
    if (go.disabled) return;
    go.disabled = true; go.textContent = 'Creating…'; name.readOnly = true; say('');
    await pending;
    const c = C.listNameClash(n, mineNow(), me.id);
    let r = null;
    if (c.live) say('You already have a list named ' + c.live.name + '.');
    else if (c.archived && !ignoreArchived) {
      const two = C.freeListName(n, mineNow().map(l => l.name));
      say('You already have an archived list named ' + c.archived.name + '.', [
        ['Restore it', async () => { if (await restoreList(c.archived.id)) { st.list = c.archived.id; dlg.close(); } }],
        ['Create “' + two + '”', () => { name.value = two; run(two, true); }]]);
    } else r = await create(n);
    go.disabled = false; go.textContent = 'Create'; name.readOnly = false;
    if (!r) return;
    if (!r.ok) {
      const again = C.listNameClash(n, mineNow(), me.id);
      say(r.err.kind === 'duplicate' && (again.live || again.archived) ? 'You already have a list named ' + n + '.' : r.err.message);
      name.focus(); return;
    }
    if (dlg.open) dlg.close(); else render(); // the close handler renders, with the new list selected
    toast('List created: ' + r.list.name);
    requestAnimationFrame(() => performance.mark('td:list-shown'));
  };
  go.onclick = e => {
    e.preventDefault();
    const n = name.value.trim();
    if (!n) { say('Enter a name'); name.focus(); return; }
    run(n, false);
  };
  // round 3 P1, F1: Enter in the name (or on the check box) is Create; the form's first button is Cancel, which Enter would press
  dlg.querySelector('form').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go.click(); } });
}
// Archive a list (owners, people only): it leaves the chips, All and search; nothing in it can be edited until it is restored
async function archiveList(id) {
  const name = label(id);
  const r = await rest('PATCH', 'lists?id=eq.' + id, { archived_at: new Date().toISOString() }, { Prefer: 'return=representation' });
  if (!r.ok || r.json.length !== 1) { toast(r.ok ? 'Only an owner archives a list' : r.err.message); return; }
  await writePrefs();
  await refreshMeta();
  if (st.list === id) st.list = 'all';
  toast('Archived: ' + name, () => restoreList(id));
  render();
}
async function restoreList(id) {
  const r = await rest('PATCH', 'lists?id=eq.' + id, { archived_at: null }, { Prefer: 'return=representation' });
  if (!r.ok || r.json.length !== 1) { toast(r.ok ? 'Only an owner restores a list' : r.err.message); return false; }
  await refreshMeta();
  toast('Restored list: ' + r.json[0].name);
  render();
  return true;
}
async function openArchivedLists() {
  const r = await rest('GET', 'lists?select=id,name,archived_at&archived_at=not.is.null&order=archived_at.desc');
  const rows = r.ok ? r.json : [];

    (rows.length ? rows.map(l => '<div class="al"><span>' + esc(l.name) + ' <span class="n">' + fmtDay(new Date(l.archived_at)) + '</span></span>' + (ROLE[l.id] === 'owner' && me.kind === 'human' ? '<button type="button" data-restore-list="' + esc(l.id) + '">Restore</button>' : '') + '</div>').join('') : '<p class="n">No archived lists</p>') +
    '<div class="actions"><button value="close" autofocus>Close</button></div></form>', '#profile');
  dlg.querySelectorAll('[data-restore-list]').forEach(b => b.onclick = async () => { b.disabled = true; if (await restoreList(b.dataset.restoreList)) dlg.close(); else b.disabled = false; });
}

// ---- sharing (multi-user T9, review §6): a list or a tag list is shared by invitation; nothing shows before Accept ----
const rpc = (name, body) => rest('POST', 'rpc/' + name, body);
const ROLE_NAMES = { owner: 'Owner', editor: 'Editor', contributor: 'Contributor', viewer: 'Viewer' };
const roleSelect = (roles, cur, attrs) => '<select ' + attrs + '>' + roles.map(r => '<option value="' + r + '"' + (r === cur ? ' selected' : '') + '>' + ROLE_NAMES[r] + '</option>').join('') + '</select>';
// after a change to memberships: lists, tag lists, tags and invitations again, then the board
async function afterMembership(msg) { await refreshMeta(); if (st.list !== 'all' && !LIST[st.list]) st.list = 'all'; if (msg) toast(msg); render(); }

// Share (owner; for a tag list also an editor) or People (member): who is on it, pending invitations, and the share form.
// kind 'list' or 'tag_list'. Round 3 (db/012): the share is sent with p_join, so a person who already has an account joins at once
// the first time (with a note saying who shared it); anyone else gets an invitation as before. Only the owner changes roles or
// removes people; an editor of a tag list may revoke the invitations they sent (the database refuses others).
const SHARE_REFRESH_MS = 10000;
function openShare(kind, id, opener) {
  const isList = kind === 'list';
  const target = isList ? (LIST[id] || HIDDEN_LISTS.find(l => l.id === id)) : TAG_LISTS[id];
  if (!target) return;
  const myRole = isList ? ROLE[id] : (TAG_LISTS[id] || {}).role;
  const owner = myRole === 'owner' && me.kind === 'human', sharer = C.canShare(myRole, kind) && me.kind === 'human';
  const roles = isList ? C.LIST_ROLES : C.TAG_LIST_ROLES;
  const what = isList ? 'Editor changes everything, Contributor adds and edits their own items, Viewer reads.'
    : 'They see these tags on items they can already see. Viewer puts them on items; Contributor also adds, renames and reorders tags; Editor also deletes and moves tags, deletes the list and shares it.';
  const dlg = dialogShell('<form method="dialog"><strong>' + (sharer ? 'Share ' : 'People on ') + '“' + esc(target.name) + '”</strong>' +
    (sharer ? '<p class="sh-note">' + esc(what) + '</p>' : '') + '<div id="sh-people" class="sh-people" aria-live="polite">Loading…</div>' +
    (sharer ? '<div class="sh-form"><label>Email<input id="sh-email" type="email" autocomplete="off" spellcheck="false" maxlength="254"></label>' +
      '<label>Role' + roleSelect(roles, 'viewer', 'id="sh-role"') + '</label></div><div class="err" id="sh-e" aria-live="polite"></div>' +
      '<p class="sh-note">No email is sent. Someone who already has an account sees it at once the first time you share with them; anyone else signs in to TasksDashboard with Google and accepts it under Sharing.</p>' : '') +
    '<div class="actions"><button value="close"' + (sharer ? '' : ' autofocus') + '>Close</button>' + (sharer ? '<button id="sh-go" value="share">Share</button>' : '') + '</div></form>', opener || '#profile');
  const box = dlg.querySelector('#sh-people'), err = dlg.querySelector('#sh-e');
  const memberAt = pid => (isList ? 'list_members?list_id=eq.' : 'tag_list_members?tag_list_id=eq.') + id + '&profile_id=eq.' + pid;
  // round 3 P1, F2: read again on open, after each action, on focus and every SHARE_REFRESH_MS while the window is open (someone may
  // leave meanwhile). A quiet read redraws only when the people changed, and never under an open role menu; the newest read wins
  let seq = 0, lastRows = null;
  const load = async quiet => {
    const n = ++seq;
    const r = await rpc(isList ? 'list_people' : 'tag_list_people', isList ? { p_list: id } : { p_tag_list: id });
    if (n !== seq || !dlg.open) return;
    if (!r.ok) { if (!quiet) box.textContent = r.err.message; return; }
    const rows = r.json.slice().sort((a, b) => (a.state === 'member' ? 0 : 1) - (b.state === 'member' ? 0 : 1) || (a.role === 'owner' ? -1 : 0) - (b.role === 'owner' ? -1 : 0));
    const key = JSON.stringify(rows);
    if (quiet && (key === lastRows || (box.contains(document.activeElement) && document.activeElement.tagName === 'SELECT'))) return;
    lastRows = key;
    box.innerHTML = rows.map(p => {
      const who = p.state === 'member' ? (p.profile_id === me.id ? esc(me.display_name) + ' <span class="n">(you)</span>' : esc(p.display_name || 'someone')) : esc(p.email);
      const role = p.role === 'owner' || !owner ? '<span class="n">' + ROLE_NAMES[p.role] + '</span>'
        : p.state === 'member' ? roleSelect(roles, p.role, 'data-role-of="' + esc(p.profile_id) + '" aria-label="Role of ' + esc(p.display_name || 'member') + '"') : '<span class="n">' + ROLE_NAMES[p.role] + ', pending</span>';
      const act = p.role === 'owner' ? '' : p.state === 'member' ? (owner ? '<button type="button" class="quiet" data-remove="' + esc(p.profile_id) + '">Remove</button>' : '')
        : sharer ? '<button type="button" class="quiet" data-revoke="' + esc(p.invite_id) + '">Revoke</button>' : '';
      return '<div class="al"><span class="al-who">' + who + '</span><span class="al-b">' + role + act + '</span></div>';
    }).join('') || 'Nobody yet';
    box.querySelectorAll('[data-role-of]').forEach(s => s.onchange = async () => {
      const r2 = await rest('PATCH', memberAt(s.dataset.roleOf), { role: s.value }, { Prefer: 'return=representation' });
      toast(r2.ok && r2.json.length ? 'Role changed' : r2.ok ? 'Not allowed' : r2.err.message); load();
    });
    box.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
      const r2 = await rest('DELETE', memberAt(b.dataset.remove), undefined, { Prefer: 'return=representation' });
      toast(r2.ok && r2.json.length ? 'Removed' : r2.ok ? 'Not allowed' : r2.err.message); load();
    });
    box.querySelectorAll('[data-revoke]').forEach(b => b.onclick = async () => {
      const r2 = await rpc('revoke_invite', { p_invite: b.dataset.revoke });
      toast(r2.ok ? 'Invitation revoked' : owner ? r2.err.message : 'Only the owner revokes an invitation someone else sent.'); load();
    });
  };
  load();
  const tick = setInterval(() => { if (document.visibilityState === 'visible') load(true); }, SHARE_REFRESH_MS), onFocus = () => load(true);
  addEventListener('focus', onFocus);
  dlg.addEventListener('close', () => { clearInterval(tick); removeEventListener('focus', onFocus); });
  const go = dlg.querySelector('#sh-go');
  if (go) {
    const email = dlg.querySelector('#sh-email');
    email.focus(); email.oninput = () => { err.textContent = ''; };
    go.onclick = async e => {
      e.preventDefault();
      const v = email.value.trim(), role = dlg.querySelector('#sh-role').value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { err.textContent = 'Enter an email address'; email.focus(); return; }
      go.disabled = true;
      // p_join: true (db/012): a first share joins a person who has an account; the answer is { ok: true } either way
      const r = await rpc(isList ? 'share_list' : 'share_tag_list', isList ? { p_list: id, p_email: v, p_role: role, p_join: true } : { p_tag_list: id, p_email: v, p_role: role, p_join: true });
      go.disabled = false;
      if (!r.ok) { err.textContent = r.err.message; email.focus(); return; }
      email.value = ''; toast('Shared with ' + v + ' as ' + ROLE_NAMES[role]); load();
    };
  }
}

// Account menu, Sharing: invitations to me (Accept, Decline, Decline and block), my lists (Share), lists shared with me (Hide, Leave)
function openSharing() {
  const mine = Object.values(LIST).concat(HIDDEN_LISTS).filter(l => ROLE[l.id] === 'owner').sort((a, b) => a.name.localeCompare(b.name));
  const shared = Object.values(LIST).concat(HIDDEN_LISTS).filter(l => ROLE[l.id] && ROLE[l.id] !== 'owner').sort((a, b) => a.name.localeCompare(b.name));
  const hidden = new Set(HIDDEN_LISTS.map(l => l.id));
  const inv = INVITES.map(i => '<div class="al"><span class="al-who">“' + esc(i.target_name) + '” <span class="n">' + (i.kind === 'list' ? 'list' : 'tags') + ' from ' + esc(i.inviter_name) + ', ' + ROLE_NAMES[i.role] + '</span></span>' +
    '<span class="al-b"><button type="button" data-accept="' + esc(i.id) + '">Accept</button><button type="button" class="quiet" data-decline="' + esc(i.id) + '">Decline</button><button type="button" class="quiet" data-block="' + esc(i.id) + '" data-from="' + esc(i.inviter_name) + '">Decline and block</button></span></div>').join('');
  const dlg = dialogShell('<form method="dialog"><strong>Sharing</strong>' +
    '<section class="rv"><strong>Invitations <span class="n">' + INVITES.length + '</span></strong>' + (inv || '<div class="rr n">None</div>') + '</section>' +
    '<section class="rv"><strong>My lists <span class="n">' + mine.length + '</span></strong>' + (mine.map(l => '<div class="al"><span class="al-who">' + esc(l.name) + (hidden.has(l.id) ? ' <span class="n">hidden</span>' : '') + '</span><span class="al-b"><button type="button" data-share-list="' + esc(l.id) + '">Share</button></span></div>').join('') || '<div class="rr n">None</div>') + '</section>' +
    '<section class="rv"><strong>Shared with me <span class="n">' + shared.length + '</span></strong>' + (shared.map(l => '<div class="al"><span class="al-who">' + esc(l.name) + ' <span class="n">' + ROLE_NAMES[ROLE[l.id]] + ', from ' + esc(personName(l.owner_id)) + '</span></span><span class="al-b">' +
      '<button type="button" class="quiet" data-people-list="' + esc(l.id) + '">People</button>' + (hidden.has(l.id) ? '<button type="button" data-unhide-list="' + esc(l.id) + '">Show</button>' : '<button type="button" class="quiet" data-hide-list="' + esc(l.id) + '">Hide for me</button>') +
      '<button type="button" class="quiet danger" data-leave-list="' + esc(l.id) + '">Leave</button></span></div>').join('') || '<div class="rr n">None</div>') + '</section>' +
    '<div class="actions"><button value="close" autofocus>Close</button></div></form>', '#profile');
  const again = () => { dlg.close(); openSharing(); };
  dlg.querySelectorAll('[data-accept]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const r = await rpc('accept_invite', { p_invite: b.dataset.accept });
    if (!r.ok) { toast(r.err.message); b.disabled = false; return; }
    await afterMembership('Accepted'); again();
  });
  dlg.querySelectorAll('[data-decline]').forEach(b => b.onclick = async () => {
    const r = await rpc('decline_invite', { p_invite: b.dataset.decline, p_block: false });
    if (!r.ok) return toast(r.err.message);
    await afterMembership('Declined'); again();
  });
  dlg.querySelectorAll('[data-block]').forEach(b => b.onclick = () => confirmAsk('Decline and block ' + b.dataset.from + '? You will not see invitations from them again.', 'Decline and block', async () => {
    const r = await rpc('decline_invite', { p_invite: b.dataset.block, p_block: true });
    if (!r.ok) return toast(r.err.message);
    await afterMembership('Declined; invitations from ' + b.dataset.from + ' are blocked'); again();
  }, '[data-menu="sharing"]'));
  dlg.querySelectorAll('[data-share-list],[data-people-list]').forEach(b => b.onclick = () => openShare('list', b.dataset.shareList || b.dataset.peopleList, '[data-menu="sharing"]'));
  dlg.querySelectorAll('[data-hide-list],[data-unhide-list]').forEach(b => b.onclick = async () => { await hideList(b.dataset.hideList || b.dataset.unhideList, !!b.dataset.hideList); again(); });
  dlg.querySelectorAll('[data-leave-list]').forEach(b => b.onclick = () => leaveList(b.dataset.leaveList, () => again()));
}
// Hide for me (list_members.hidden_at): the list leaves my chips, All and search; Hidden lists brings it back
async function hideList(id, hide) {

// Leave: my membership goes (owners cannot leave); only the owner can invite me again

// Account menu → Tags (round 3, adjustment 5): every tag list I can see, stacked in the task window's order (my default, ★, first).
// Each action shows only when my role allows it (C.tagListRights). A list I may rename has its name as a text box. A tag opens its
// menu on click or right-click: Rename, Move to list (another live list of the same owner; move_tags merges a name already there),
// Count as Mine (profiles.mine_tag_ids), Delete. Drag a tag onto another list to move it, or between tags of its list to reorder
// it (tags.sort, Alt+Left / Alt+Right); drag my lists by their grip to reorder them (tag_lists.sort, Alt+Up / Alt+Down on the name).
// "Delete list" archives it (set_tag_list_archived): its chips leave every card. "Archived tags" shows the archived lists the same
// way, read only, with Restore.
function openTags(archivedView) {
  const dlg = dialogShell('<form method="dialog" class="tgm"><strong>' + (archivedView ? 'Archived tags' : 'Tags') + '</strong>' +
    '<p class="sh-note">' + (archivedView ? 'These tag lists are read only and their tags show on no card. Restore one to use or change it.' : 'Drag a tag onto another list to move it, or between tags to reorder. Click a tag for more.') + '</p>' +
    '<div id="tgm-body" class="tgm-body"></div><div class="err" id="tgm-e" aria-live="polite"></div>' +
    (archivedView ? '' : '<div class="tg-row tgm-new"><input id="tgl-new" maxlength="60" placeholder="New tag list" aria-label="Name of a new tag list"><button type="button" id="tgl-add">Create list</button></div>') +
    '<div class="actions"><button type="button" id="tgm-switch" class="quiet">' + (archivedView ? 'Back to tags' : 'Archived tags') + '</button><span class="sp"></span><button value="close">Close</button></div></form>', '#profile');
  const body = dlg.querySelector('#tgm-body'), err = dlg.querySelector('#tgm-e');
  const say = m => { err.textContent = m || ''; };
  let drag = null;
  const groupsNow = () => C.tagGroups(TAG_LISTS, TAG, me.id, NAMES, { archived: !!archivedView, hidden: true, order: tagListOrder });
  const after = (msg, focus) => { relabel(); renderSoon(); draw(focus); if (msg) toast(msg); };
  const trayHtml = g => {

function bind() {
  const app = document.getElementById('app');
  bindLogo();
  app.querySelectorAll('[data-list]').forEach(b => b.onclick = () => { st.list = b.dataset.list; st.pop = null; st.expanded = null; render(); });
  bindListDrag(app);
  const popBtn = (id, name) => { const b = document.getElementById(id); if (b) b.onclick = e => { e.stopPropagation(); st.pop = st.pop === name ? null : name; render(); }; };
  popBtn('more', 'more'); popBtn('listmenu', 'listmenu'); popBtn('due', 'due'); popBtn('tag', 'tag'); popBtn('cat', 'cat'); popBtn('profile', 'profile');
  const nl = document.getElementById('newlist'); if (nl) nl.onclick = () => openNewList();
  app.querySelectorAll('[data-archive-list]').forEach(b => b.onclick = e => { e.stopPropagation(); const id = b.dataset.archiveList; st.pop = null; render(); confirmAsk('Archive the list “' + label(id) + '”? It disappears from the board and nothing in it can be changed until an owner restores it.', 'Archive', () => archiveList(id), '#listmenu'); });
  // the theme starts as Auto (follows the system); a click sets Light or Dark
  document.getElementById('theme').onclick = () => { themePref = st.theme ? 'light' : 'dark'; applyTheme(); render(); document.getElementById('theme').focus(); };
  const qi = document.getElementById('q');
  qi.oninput = () => { st.keep.clear(); st.q = qi.value; st.sel = -1; st.focusQ = true; render(); };
  qi.onkeydown = e => {
    const n = (st.rows || []).length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); st.sel = (st.sel + 1) % n; st.focusQ = true; render(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); st.sel = (st.sel - 1 + n) % n; st.focusQ = true; render(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (st.sel >= 0 && st.rows[st.sel]) { const id = st.rows[st.sel].id; st.sel = -1; openTask(id); } else { qi.blur(); document.getElementById('dd')?.remove(); } }
    else if (e.key === 'Escape') { document.getElementById('dd')?.remove(); st.sel = -1; }
  };

    const up = () => { grip.classList.remove('on'); root.classList.remove('rail-moving'); grip.removeEventListener('pointermove', move); if (railOff) railW = startW; railApply(true); if (railOff) opener.focus(); };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up, { once: true });
    grip.addEventListener('pointercancel', up, { once: true });
  });
  grip.addEventListener('keydown', e => {
    const step = e.shiftKey ? 64 : 16;
    if (e.key === 'ArrowRight') railW += step;
    else if (e.key === 'ArrowLeft') { if (railW <= RAIL_MIN) { hide(); e.preventDefault(); return; } railW -= step; }
    else if (e.key === 'Enter') { hide(); e.preventDefault(); return; }
    else if (e.key === 'Home') railW = RAIL_DEFAULT;
    else return;
    e.preventDefault();
    railApply(true);
  });
  railApply(false);

  const app = document.getElementById('app');
  if (app) new MutationObserver(() => { lit = null; mount(); }).observe(app, { childList: true });
  let raf = 0;
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { railApply(false); apply(false); }); });
  apply(false);
  mount();

  setTimeout(() => root.classList.add('settled'), 1200);
})();
</script>
</body>
</html>
