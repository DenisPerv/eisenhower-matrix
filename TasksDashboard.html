      b.onkeydown = e => {
        if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteTag(x); }
        else if (e.key === 'F2') { e.preventDefault(); b.ondblclick(e); }
        else if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); moveTag(x, known.indexOf(x) + (e.key === 'ArrowLeft' ? -1 : 1)); drawTags(false, x); }
      };
      w.querySelector('.tag-x').onclick = () => deleteTag(x);
      w.ondragstart = e => { dragTag = x; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', x); w.classList.add('dragging'); };
      w.ondragend = () => { dragTag = null; clearMarks(); };
      w.ondragover = e => {
        if (dragTag === null || dragTag === x) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        const r = w.getBoundingClientRect(), before = e.clientX < r.left + r.width / 2;
        box.querySelectorAll('.drop-before,.drop-after').forEach(o2 => o2.classList.remove('drop-before', 'drop-after'));
        w.classList.add(before ? 'drop-before' : 'drop-after');
      };
      w.ondrop = e => {
        if (dragTag === null || dragTag === x) return;
        e.preventDefault(); e.stopPropagation();
        const r = w.getBoundingClientRect(), before = e.clientX < r.left + r.width / 2, moving = dragTag;
        known.splice(known.indexOf(moving), 1);
        known.splice(known.indexOf(x) + (before ? 0 : 1), 0, moving);
        keepOrder();
        dragTag = null; drawTags(false, moving);
      };
    });
    const add = box.querySelector('.tag-add');
    add.onclick = () => {
      add.replaceWith(editBox('', v => {
        if (v) {
          // an existing tag with that name (mine first), else a new one for my Default
          const same = known.filter(x => lab(x).toLowerCase() === v.toLowerCase() || (!isNew(x) && TAG[x].name.toLowerCase() === v.toLowerCase()));
          const d = myDefault();
          const k = same.find(x => !isNew(x) && d && TAG[x].tag_list_id === d.id) || same[0] || 'new:' + v;
          if (!known.includes(k)) known.push(k);
          chosen.add(k);
        }
        drawTags(v !== null);
      }));
      box.querySelector('.tag-new').focus();
    };
    if (focusAdd) box.querySelector('.tag-add').focus();
    if (focusTag) [...box.querySelectorAll('.tagchip')].find(b => b.dataset.t === focusTag)?.focus();
  };
  drawTags(false);
  dlg.addEventListener('cancel', e => { if (document.activeElement && document.activeElement.classList.contains('tag-new')) e.preventDefault(); });
  const fc = dlg.querySelector('#fcancel');
  if (fc) fc.onclick = () => { dlg.close(); const r = edit(t, x => { x.status = 'cancelled'; }); toast('Cancelled: ' + plain(t.title), undoEdit(t, r)); };
  const fdel = dlg.querySelector('#fdel');
  if (fdel) fdel.onclick = () => { dlg.close(); removeTask(t); };
  const fs = dlg.querySelector('#fs');
  if (fs) fs.onclick = e => {
    const title = htmlToMd(dlg.querySelector('#ft')).replace(/\n+/g, ' ').trim(), notes = htmlToMd(dlg.querySelector('#fn')).trim(), list = dlg.querySelector('#fl').value;
    let bad = false;
    if (!plain(title).trim()) { dlg.querySelector('#fe').textContent = 'Title can\'t be empty'; bad = true; }
    else if (title.length > 300) { dlg.querySelector('#fe').textContent = 'The title is over 300 characters (' + title.length + ')'; bad = true; }
    if (!list) { dlg.querySelector('#fle').textContent = 'Choose a list'; bad = true; }
    const endV = dlg.querySelector('#fd').value;
    if (endV && start && new Date(endV) <= start) { dlg.querySelector('#fde').textContent = 'End must be after ' + ymd(start); bad = true; }
    if (bad) { e.preventDefault(); (title ? dlg.querySelector('#fl') : dlg.querySelector('#ft')).focus(); return; }
    const fq = t ? dlg.querySelector('#fq').value : (quad || 'B');
    const deadline = endV ? new Date(endV) : null;
    const picked = known.filter(x => chosen.has(x)), newNames = picked.filter(isNew).map(x => x.slice(4));
    const save = created => {
      const tags = untouched().concat(picked.filter(x => !isNew(x)), created.filter(x => !untouched().includes(x)));
      if (t) {
        const now = { title, notes, tags: tagKey(tags), deadline: deadline ? deadline.getTime() : null, list, q: fq };
        const mine = Object.keys(now).filter(k => now[k] !== shown[k]);
        const cur = { title: t.title, notes: t.notes, tags: tagKey(t.tags), deadline: t.deadline ? t.deadline.getTime() : null, list: t.list, q: t.q };
        const theirs = t.version !== shown.version ? mine.filter(k => cur[k] !== shown[k] && cur[k] !== now[k]) : [];
        if (theirs.length) {
          const names = { title: 'title', notes: 'description', tags: 'tags', deadline: 'end', list: 'list', q: 'quadrant' };
          setTimeout(() => openTask(t.id, null, { draft: { title, notes, list, tags, deadline }, notice: 'Changed by someone else while you edited: ' + theirs.map(k => names[k]).join(', ') + '. Their version is saved; your text is below. Save again to replace it.' }), 0);
          return;
        }
        const moved = mine.includes('list'), fromQ = t.q;
        const key = mine.includes('q') || moved ? topKey(list, fq) : t.sortKey;
        const r = edit(t, x => {
          if (mine.includes('q')) { if (URGENT[fq] !== URGENT[fromQ]) x.pin = URGENT[fq]; x.qStored = fq; }
          if (mine.includes('title')) x.title = title;
          if (mine.includes('notes')) x.notes = notes;
          if (mine.includes('tags')) x.tags = tags;
          if (mine.includes('deadline')) x.deadline = deadline;
          if (moved) x.list = list;
          x.sortKey = key;
        }, { origin: 'dialog' });
        st.keep.add(t.id);
        if (r) toast(moved ? 'Moved to ' + label(list) : 'Saved', undoEdit(t, r));
      } else {
        const cat = LIST[list].default_category || 'task';
        // the person who adds it is who it is for (owner_id; "Mine"), as the owner tag was before multi-user
        const nt = { id: crypto.randomUUID(), list, num: 0, qStored: fq, q: fq, title, notes, tags, deadline, start, status: 'open', doneAt: null, pin: undefined,
          sortKey: topKey(list, fq), category: cat, priority: null, reviewState: 'none', aiConfidence: null, createdBy: me.id, ownerId: me.kind === 'human' ? me.id : null, version: 1, deleted: false, updatedAt: null };
        create(nt, { origin: 'dialog' }); st.keep.add(nt.id);
        toast('Added to ' + label(list) + ': ' + plain(title), canDo('delete', null, list) ? () => removeTask(nt, true) : null);
      }
    };
    if (!newNames.length) return save([]);
    // new tag names: created in my Default first, then the save goes on (the window closes when they exist)
    e.preventDefault(); fs.disabled = true; fs.textContent = 'Saving…';
    ensureTags(newNames).then(ids => { dlg.close(); save(ids); render(); });
  };
  dlg.addEventListener('close', () => { dlg.remove(); render(); const back = opener && document.querySelector(opener); if (back) back.focus(); });
  dlg.querySelector('#ft').addEventListener('input', () => dlg.querySelector('#fe').textContent = '');
  dlg.querySelector('#fl').addEventListener('change', () => dlg.querySelector('#fle').textContent = '');
  dlg.querySelector('#fd').addEventListener('input', () => dlg.querySelector('#fde').textContent = '');
}
// soft delete (deleted_at); Undo within 8 s restores it, after that only admin SQL does (no trash view)
function removeTask(t, quiet) {
  const r = edit(t, x => { x.deleted = true; });
  if (!quiet) toast('Deleted: ' + plain(t.title), () => edit(t, x => { x.deleted = false; }));
  render();
  return r;
}
// restore from the archive: the status from before it was completed or cancelled (item_events), open if unknown
async function restoreTask(t) {
  let prev = 'open';
  const r = await rest('GET', 'item_events?select=diff&item_id=eq.' + t.id + '&order=id.desc&limit=50');
  if (r.ok) { const ev = r.json.find(e => e.diff && e.diff.status && e.diff.status.new === t.status); if (ev && C.STATUSES.includes(ev.diff.status.old) && !C.CLOSED.includes(ev.diff.status.old)) prev = ev.diff.status.old; }
  const u = edit(t, x => { x.status = prev; });
  toast('Restored: ' + plain(t.title), undoEdit(t, u));
  render();
}

function dialogShell(html, opener) {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = html;
  document.body.append(dlg); dlg.showModal();
  dlg.addEventListener('close', () => { dlg.remove(); render(); document.querySelector(opener)?.focus(); });
  return dlg;
}

// weekly review: the last 7 days of the selected list (All = every list), ignoring search and filters
function openReview() {
  const from = new Date(TODAY.getTime() - 7 * DAY), to = new Date(TODAY.getTime() + 7 * DAY);
  const mine = all().filter(inList);
  const open = mine.filter(t => !t.doneAt);
  const sec = (title, list) => '<section class="rv"><strong>' + title + ' <span class="n">' + list.length + '</span></strong>' + (list.length ? list.map(t => '<div class="rr"><span class="k">' + ref(t) + '</span> ' + esc(plain(t.title)) + (t.deadline ? ' <span class="n">' + rel(t) + '</span>' : '') + '</div>').join('') : '<div class="rr n">0</div>') + '</section>';
  dialogShell('<form method="dialog"><strong>Weekly review</strong><div class="n">' + ymd(from).slice(0, 10) + ' – ' + ymd(TODAY).slice(0, 10) + '</div>' +
    sec('Overdue', open.filter(overdue)) +
    sec('Became urgent this week', open.filter(t => t.deadline && t.deadline > TODAY && t.deadline - TODAY < settings.windowDays * DAY * (1 - settings.threshold / 100))) +
    sec('Completed this week', mine.filter(t => t.doneAt && t.doneAt >= from)) +
    sec('Due in the next 7 days', open.filter(t => t.deadline && t.deadline >= TODAY && t.deadline <= to)) +
    '<div class="actions"><button value="close" autofocus>Close</button></div></form>', '#profile');
}

// settings are saved per person in the preferences row; display name and time zone are the profile's own columns
function openSettings() {
  const browserTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
  const zones = (() => { try { return Intl.supportedValuesOf('timeZone'); } catch (e) { return []; } })();
  const human = me.kind === 'human';
  const dlg = dialogShell('<form method="dialog"><strong>Settings</strong>' +
    (human ? '<label>Display name<input id="s-name" maxlength="60" autocomplete="name" value="' + esc(me.display_name) + '"></label><div class="err" id="s-name-e" aria-live="polite"></div>' +
      '<label>Time zone<input id="s-tz" list="s-tzs" autocomplete="off" spellcheck="false" value="' + esc(me.timezone || browserTz) + '"></label><datalist id="s-tzs">' + zones.map(z => '<option value="' + esc(z) + '">').join('') + '</datalist><div class="err" id="s-tz-e" aria-live="polite"></div>' : '') +
    '<label>Urgency threshold, %<input id="s-th" type="number" min="10" max="90" step="5" value="' + settings.threshold + '"></label>' +
    '<label>Urgency window, days<input id="s-win" type="number" min="1" max="30" value="' + settings.windowDays + '"></label>' +
    '<label class="cb"><input id="s-wd" type="checkbox"' + (settings.workingDays ? ' checked' : '') + '> Working days only</label>' +
    '<label>Do limit<input id="s-lim" type="number" min="0" max="50" value="' + settings.doLimit + '"></label>' +
    '<label>Working hours per day<input id="s-hpd" type="number" min="1" max="24" value="' + settings.hoursPerDay + '"></label>' +
    '<div class="actions"><button value="cancel">Cancel</button><button id="s-save" value="save">Save</button></div></form>', '#profile');
  dlg.querySelector('#s-save').onclick = e => {
    const num = (id, lo, hi, dflt) => { const v = Number(dlg.querySelector(id).value); return v >= lo && v <= hi ? v : dflt; };
    const patch = {};
    if (human) {
      const name = dlg.querySelector('#s-name').value.replace(/[\u0000-\u001f\u007f]/g, '').trim(), tz = dlg.querySelector('#s-tz').value.trim();
      if (!name) { e.preventDefault(); dlg.querySelector('#s-name-e').textContent = 'Enter a name'; dlg.querySelector('#s-name').focus(); return; }
      if (tz && zones.length && !zones.includes(tz) && tz !== 'UTC') { e.preventDefault(); dlg.querySelector('#s-tz-e').textContent = 'Pick a time zone from the list'; dlg.querySelector('#s-tz').focus(); return; }
      if (name !== me.display_name) patch.display_name = name;
      if (tz && tz !== me.timezone) patch.timezone = tz;
    }
    settings = C.readSettings({ threshold: num('#s-th', 10, 90, 50), windowDays: num('#s-win', 1, 30, 7), workingDays: dlg.querySelector('#s-wd').checked, doLimit: num('#s-lim', 0, 50, 5), hoursPerDay: num('#s-hpd', 1, 24, 8) });
    if (!Object.keys(patch).length) return toast('Settings saved');
    rest('PATCH', 'profiles?id=eq.' + me.id, patch, { Prefer: 'return=representation' }).then(r => {
      if (r.ok && r.json.length) { Object.assign(me, patch); NAMES[me.id] = me.display_name; toast('Settings saved'); render(); }
      else toast('Settings saved; name and time zone not: ' + (r.ok ? 'not allowed' : r.err.message));
    });
  };
}

// New list: rpc/create_list, private unless "Share with the household" (household members only, D-d of the multi-user plan).

    (hh ? '<label class="cb"><input id="nl-shared" type="checkbox" checked> Share with the household and the HomeOS agent</label>' : '<p class="sh-note">Only you see it until you share it (list menu, Share).</p>') +
    '<div class="actions"><button value="cancel">Cancel</button><button id="nl-go" value="create">Create</button></div></form>', '#newlist');

// Archive a list (owners, people only): it leaves the chips, All and search; nothing in it can be edited until it is restored
async function archiveList(id) {
  const name = label(id);
  const r = await rest('PATCH', 'lists?id=eq.' + id, { archived_at: new Date().toISOString() }, { Prefer: 'return=representation' });
  if (!r.ok || r.json.length !== 1) { toast(r.ok ? 'Only an owner archives a list' : r.err.message); return; }
  await writePrefs();
  await refreshMeta();
  if (st.list === id) st.list = 'all';
  toast('Archived: ' + name, () => restoreList(id));
  render();
}

// ---- sharing (multi-user T9, review §6): a list or a tag list is shared by invitation; nothing shows before Accept ----
const rpc = (name, body) => rest('POST', 'rpc/' + name, body);
const ROLE_NAMES = { owner: 'Owner', editor: 'Editor', contributor: 'Contributor', viewer: 'Viewer' };
const roleSelect = (roles, cur, attrs) => '<select ' + attrs + '>' + roles.map(r => '<option value="' + r + '"' + (r === cur ? ' selected' : '') + '>' + ROLE_NAMES[r] + '</option>').join('') + '</select>';
// after a change to memberships: lists, tag lists, tags and invitations again, then the board
async function afterMembership(msg) { await refreshMeta(); if (st.list !== 'all' && !LIST[st.list]) st.list = 'all'; if (msg) toast(msg); render(); }

// Share (owner) or People (member): who is on it, pending invitations, and the invite form. kind 'list' or 'tag_list'.
function openShare(kind, id, opener) {
  const isList = kind === 'list';
  const target = isList ? (LIST[id] || HIDDEN_LISTS.find(l => l.id === id)) : TAG_LISTS[id];
  if (!target) return;
  const owner = (isList ? ROLE[id] : (TAG_LISTS[id] || {}).role) === 'owner' && me.kind === 'human';
  const roles = isList ? C.LIST_ROLES : C.TAG_LIST_ROLES;
  const what = isList ? 'They see the list and its items once they accept, with what the role allows: Editor changes everything, Contributor adds and edits their own items, Viewer reads.'
    : 'They see your tags on items they can already see, once they accept. Editor also adds tags to this list and puts them on items they can edit; Viewer only sees them.';
  const dlg = dialogShell('<form method="dialog"><strong>' + (owner ? 'Share ' : 'People on ') + '“' + esc(target.name) + '”</strong>' +
    (owner ? '<p class="sh-note">' + esc(what) + '</p>' : '') + '<div id="sh-people" class="sh-people" aria-live="polite">Loading…</div>' +
    (owner ? '<div class="sh-form"><label>Email<input id="sh-email" type="email" autocomplete="off" spellcheck="false" maxlength="254"></label>' +
      '<label>Role' + roleSelect(roles, 'viewer', 'id="sh-role"') + '</label></div><div class="err" id="sh-e" aria-live="polite"></div>' +
      '<p class="sh-note">No email is sent: tell them to sign in to TasksDashboard with Google and accept it under Sharing.</p>' : '') +
    '<div class="actions"><button value="close"' + (owner ? '' : ' autofocus') + '>Close</button>' + (owner ? '<button id="sh-go" value="share">Invite</button>' : '') + '</div></form>', opener || '#profile');
  const box = dlg.querySelector('#sh-people'), err = dlg.querySelector('#sh-e');
  const memberAt = pid => (isList ? 'list_members?list_id=eq.' : 'tag_list_members?tag_list_id=eq.') + id + '&profile_id=eq.' + pid;
  const load = async () => {
    const r = await rpc(isList ? 'list_people' : 'tag_list_people', isList ? { p_list: id } : { p_tag_list: id });
    if (!r.ok) { box.textContent = r.err.message; return; }
    const rows = r.json.slice().sort((a, b) => (a.state === 'member' ? 0 : 1) - (b.state === 'member' ? 0 : 1) || (a.role === 'owner' ? -1 : 0) - (b.role === 'owner' ? -1 : 0));
    box.innerHTML = rows.map(p => {
      const who = p.state === 'member' ? (p.profile_id === me.id ? esc(me.display_name) + ' <span class="n">(you)</span>' : esc(p.display_name || 'someone')) : esc(p.email);
      const role = p.role === 'owner' || !owner ? '<span class="n">' + ROLE_NAMES[p.role] + '</span>'
        : p.state === 'member' ? roleSelect(roles, p.role, 'data-role-of="' + esc(p.profile_id) + '" aria-label="Role of ' + esc(p.display_name || 'member') + '"') : '<span class="n">' + ROLE_NAMES[p.role] + ', pending</span>';
      const act = !owner || p.role === 'owner' ? '' : p.state === 'member' ? '<button type="button" class="quiet" data-remove="' + esc(p.profile_id) + '">Remove</button>' : '<button type="button" class="quiet" data-revoke="' + esc(p.invite_id) + '">Revoke</button>';
      return '<div class="al"><span class="al-who">' + who + '</span><span class="al-b">' + role + act + '</span></div>';
    }).join('') || 'Nobody yet';
    box.querySelectorAll('[data-role-of]').forEach(s => s.onchange = async () => {
      const r2 = await rest('PATCH', memberAt(s.dataset.roleOf), { role: s.value }, { Prefer: 'return=representation' });
      toast(r2.ok && r2.json.length ? 'Role changed' : r2.ok ? 'Not allowed' : r2.err.message); load();
    });
    box.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
      const r2 = await rest('DELETE', memberAt(b.dataset.remove), undefined, { Prefer: 'return=representation' });
      toast(r2.ok && r2.json.length ? 'Removed' : r2.ok ? 'Not allowed' : r2.err.message); load();
    });
    box.querySelectorAll('[data-revoke]').forEach(b => b.onclick = async () => {
      const r2 = await rpc('revoke_invite', { p_invite: b.dataset.revoke });
      toast(r2.ok ? 'Invitation revoked' : r2.err.message); load();
    });
  };
  load();
  const go = dlg.querySelector('#sh-go');
  if (go) {
    const email = dlg.querySelector('#sh-email');
    email.focus(); email.oninput = () => { err.textContent = ''; };
    go.onclick = async e => {
      e.preventDefault();
      const v = email.value.trim(), role = dlg.querySelector('#sh-role').value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { err.textContent = 'Enter an email address'; email.focus(); return; }
      go.disabled = true;
      const r = await rpc(isList ? 'share_list' : 'share_tag_list', isList ? { p_list: id, p_email: v, p_role: role } : { p_tag_list: id, p_email: v, p_role: role });
      go.disabled = false;
      if (!r.ok) { err.textContent = r.err.message; email.focus(); return; }
      email.value = ''; toast('Invited ' + v + ' as ' + ROLE_NAMES[role]); load();
    };
  }
}

// Account menu, Sharing: invitations to me (Accept, Decline, Decline and block), my lists (Share), lists shared with me (Hide, Leave)
function openSharing() {
  const mine = Object.values(LIST).concat(HIDDEN_LISTS).filter(l => ROLE[l.id] === 'owner').sort((a, b) => a.name.localeCompare(b.name));

  // glow under the pointer on the quadrant background; it fades out when the pointer leaves the quadrant
  document.addEventListener('pointermove', e => {
    const q = e.target.closest && e.target.closest('section.q');
    if (!q) return;
    const r = q.getBoundingClientRect();
    q.style.setProperty('--qx', (e.clientX - r.left) + 'px');
    q.style.setProperty('--qy', (e.clientY - r.top) + 'px');
  }, { passive: true });

  // pointing at a card lights its row in the side list (when that row is shown), in the card's quadrant colour
  let lit = null;
  const unlight = () => { if (lit) { lit.classList.remove('hl'); lit = null; } };
  document.addEventListener('pointerover', e => {
    const card = e.target.closest && e.target.closest('[data-card]');
    if (!card) { unlight(); return; }
    const row = document.querySelector('.mrow[data-hl="' + card.dataset.card + '"]');
    if (row === lit) return;
    unlight();
    if (!row) return;
    row.dataset.hq = ['A', 'B', 'C', 'D'].find(q => card.classList.contains(q)) || '';
    row.classList.add('hl');
    lit = row;
  });

  // movable axes: the y axis splits not urgent | urgent, the x axis splits important / not important
  // the split is kept in the person's preferences row: the main script sets it through window.tdAxes and is told when it changes
  let fx = 0.5, fy = 0.5;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  let minCol = 0;
  const measureMinCol = () => {
    // one card title of about 50 characters, plus the card's own chrome (colour bar, chevron, check box) and the quadrant padding
    const t = document.querySelector('.card .t');
    const font = t ? getComputedStyle(t).font : '500 14px "Segoe UI Variable Text", sans-serif';
    const c = document.createElement('canvas').getContext('2d');
    c.font = font;
    return Math.ceil(c.measureText('Stock analysis and the no-finance-advice rule plus').width) + 140;
  };
  const matrix = () => document.querySelector('.matrix:not(.one)');
  const apply = save => {
    const m = matrix();
    if (m && m.clientWidth) {
      if (!minCol) minCol = measureMinCol();
      const W = m.clientWidth - GAP, H = m.clientHeight - GAP;
      const mc = Math.min(minCol, W / 2), mr = Math.min(MIN_ROW, H / 2);
      fx = clamp(fx, mc / W, 1 - mc / W);
      fy = clamp(fy, mr / H, 1 - mr / H);
      m.querySelectorAll('.axis').forEach(a => {
        const v = a.classList.contains('axis-x') ? fy : fx;
        a.setAttribute('aria-valuenow', Math.round(v * 100));
      });
    }
    root.style.setProperty('--fx', fx.toFixed(4));
    root.style.setProperty('--fy', fy.toFixed(4));
    if (save && window.tdAxes && window.tdAxes.onSave) window.tdAxes.onSave();
  };
  window.tdAxes = Object.assign(window.tdAxes || {}, {
    get: () => ({ fx: +fx.toFixed(4), fy: +fy.toFixed(4) }),
    set: (x, y) => { fx = x; fy = y; apply(false); },
  });
  const handle = (cls, label, orient) => {
    const h = document.createElement('div');
    h.className = 'axis ' + cls;
    h.tabIndex = 0;
    h.setAttribute('role', 'separator');
    h.setAttribute('aria-label', label);
    if (orient) h.setAttribute('aria-orientation', orient);
    h.setAttribute('aria-valuemin', '0');
    h.setAttribute('aria-valuemax', '100');
    return h;
  };
  const mount = () => {
    const m = matrix();
    if (!m || m.querySelector('.axis')) return;
    const y = handle('axis-y', 'Urgency axis', 'vertical');
    const x = handle('axis-x', 'Importance axis', 'horizontal');
    const xy = handle('axis-xy', 'Both axes', '');
    m.append(y, x, xy);
    [[y, 1, 0], [x, 0, 1], [xy, 1, 1]].forEach(([h, mx, my]) => {
      h.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        h.setPointerCapture(e.pointerId);
        h.classList.add('on'); m.classList.add('resizing'); root.classList.add('axes-moving');
        const r = m.getBoundingClientRect();
        const move = ev => {
          if (mx) fx = (ev.clientX - r.left - GAP / 2) / (r.width - GAP);
          if (my) fy = (ev.clientY - r.top - GAP / 2) / (r.height - GAP);
          apply(false);
        };
        const up = () => { h.classList.remove('on'); m.classList.remove('resizing'); root.classList.remove('axes-moving'); h.removeEventListener('pointermove', move); apply(true); };
        h.addEventListener('pointermove', move);
        h.addEventListener('pointerup', up, { once: true });
        h.addEventListener('pointercancel', up, { once: true });
      });
      h.addEventListener('dblclick', () => { if (mx) fx = 0.5; if (my) fy = 0.5; apply(true); });
      h.addEventListener('keydown', e => {
        const step = e.shiftKey ? 0.1 : 0.02;
        const k = e.key;
        if (mx && k === 'ArrowLeft') fx -= step; else if (mx && k === 'ArrowRight') fx += step;
        else if (my && k === 'ArrowUp') fy -= step; else if (my && k === 'ArrowDown') fy += step;
        else if (k === 'Home') { if (mx) fx = 0.5; if (my) fy = 0.5; }
        else return;
        e.preventDefault();
        apply(true);
        pulse();
      });
    });
    apply(false);
  };
  // the background answers a keyboard move with a short pulse, the same as a drag
  let pulseT = 0;
  const pulse = () => { root.classList.add('axes-moving'); clearTimeout(pulseT); pulseT = setTimeout(() => root.classList.remove('axes-moving'), 450); };

  // side menu: drag its right edge to resize it (256 px to start, 128 px at the least); dragging below 128 px or double-clicking the edge hides it,
  // and the slim tab on the left edge brings it back
  const RAIL_MIN = 128, RAIL_DEFAULT = 256, RAIL_KEY = 'td.rail';
  const railMax = () => Math.max(RAIL_MIN, Math.min(560, innerWidth * 0.45));
  let railW = RAIL_DEFAULT, railOff = false;
  try { const s = JSON.parse(localStorage.getItem(RAIL_KEY) || 'null'); if (s) { railW = +s.w || RAIL_DEFAULT; railOff = !!s.off; } } catch (_) {}
  const svgIcon = p => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + p + '</svg>';
  const railApply = save => {
    railW = Math.round(Math.min(railMax(), Math.max(RAIL_MIN, railW)));
    root.style.setProperty('--rail-w', railW + 'px');
    root.classList.toggle('rail-off', railOff);
    grip.setAttribute('aria-valuenow', railW);
    opener.setAttribute('aria-expanded', String(!railOff));
    requestAnimationFrame(() => apply(false));
    if (save) try { localStorage.setItem(RAIL_KEY, JSON.stringify({ w: railW, off: railOff })); } catch (_) {}
  };
  const grip = document.createElement('div');
  grip.className = 'rail-grip';
  grip.tabIndex = 0;
  grip.setAttribute('role', 'separator');
  grip.setAttribute('aria-orientation', 'vertical');
  grip.setAttribute('aria-label', 'Side menu width');
  grip.setAttribute('aria-valuemin', String(RAIL_MIN));
  const opener = document.createElement('button');
  opener.type = 'button';
  opener.className = 'rail-open';
  opener.setAttribute('aria-label', 'Show side menu');
  opener.innerHTML = svgIcon('<path d="m13 17 5-5-5-5M6 17l5-5-5-5"/>');
  document.body.append(grip, opener);
  const hide = () => { railOff = true; railApply(true); opener.focus(); };
  const show = () => { railOff = false; railApply(true); };
  opener.addEventListener('click', show);
  grip.addEventListener('dblclick', hide);
  grip.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add('on'); root.classList.add('rail-moving');
    const startW = railW;   // a menu folded away by dragging comes back at the width it had before the drag
    const move = ev => {
      if (ev.clientX < RAIL_MIN) { railOff = true; }   // dragged below the minimum: the menu folds away
      else { railOff = false; railW = ev.clientX; }
      railApply(false);
    };
    const up = () => { grip.classList.remove('on'); root.classList.remove('rail-moving'); grip.removeEventListener('pointermove', move); if (railOff) railW = startW; railApply(true); if (railOff) opener.focus(); };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up, { once: true });
    grip.addEventListener('pointercancel', up, { once: true });
  });
  grip.addEventListener('keydown', e => {
    const step = e.shiftKey ? 64 : 16;
    if (e.key === 'ArrowRight') railW += step;
    else if (e.key === 'ArrowLeft') { if (railW <= RAIL_MIN) { hide(); e.preventDefault(); return; } railW -= step; }
    else if (e.key === 'Enter') { hide(); e.preventDefault(); return; }
    else if (e.key === 'Home') railW = RAIL_DEFAULT;
    else return;
    e.preventDefault();
    railApply(true);
  });
  railApply(false);

  const app = document.getElementById('app');
  if (app) new MutationObserver(() => { lit = null; mount(); }).observe(app, { childList: true });
  let raf = 0;
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { railApply(false); apply(false); }); });
  apply(false);
  mount();

  setTimeout(() => root.classList.add('settled'), 1200);
})();
</script>
</body>
</html>
