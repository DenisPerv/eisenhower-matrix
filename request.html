<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TasksDashboard: request access</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M1.6 1.6V30.4H30.4%22 fill=%22none%22 stroke=%22%2317181B%22 stroke-width=%221.4%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M15.6 27.17L29.99 26.87A25.4 25.4 0 0 0 26.86 15.16L14.24 22.1A11 11 0 0 1 15.6 27.17Z%22 fill=%22%23C2922A%22/%3E%3Cpath d=%22M14.01 21.7L26.33 14.24A25.4 25.4 0 0 0 17.76 5.67L10.3 17.99A11 11 0 0 1 14.01 21.7Z%22 fill=%22%23B5392C%22/%3E%3Cpath d=%22M9.9 17.76L16.84 5.14A25.4 25.4 0 0 0 5.13 2.01L4.83 16.4A11 11 0 0 1 9.9 17.76Z%22 fill=%22%231F6B4F%22/%3E%3C/svg%3E">
<!-- The public access-request page (access-backup-plan.md A1): no board data, Google sign-in (PKCE, no library), then
     rpc/my_access_request and, when there is no request yet, rpc/request_access. One inline script: its sha256 is in the
     deploy's _headers (docs/deployment/2-deploy.md). The look is the app's "Aurora instrument" (TasksDashboard.html UI 4-5). -->
<style>
:root{
  --ui:"Bahnschrift","DIN Alternate","DIN 2014","Segoe UI",system-ui,sans-serif;
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Sitka Display","Sitka Heading","Sitka","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:3px;--r-xl:6px;
  --bg:#F3F1EA;--grid:rgba(32,28,70,.055);
  --au1:rgba(99,102,241,.30);--au2:rgba(168,85,247,.24);--au3:rgba(14,165,233,.22);--au4:rgba(129,140,248,.22);
  --solid:#FFFFFF;--hair:rgba(28,26,52,.12);--hair2:rgba(28,26,52,.24);
  --depth:0 1px 0 rgba(28,26,52,.05),0 14px 28px -22px rgba(28,26,52,.45);
  --ink:#13121F;--ink2:#383650;--ink3:#64627A;--hover:rgba(80,60,240,.06);--well:rgba(28,26,52,.045);
  --accent:#5235F0;--accent-ink:#3F22D9;--accent-bg:rgba(82,53,240,.09);--accent-line:rgba(82,53,240,.4);--glow:rgba(82,53,240,.28);--on-accent:#FFFFFF;
  --qa:#E5484D;--qb:#14A35A;--qc:#F2B500;--qd:#6B7491;
  --danger:#E5484D;--danger-ink:#C62A31;--danger-bg:rgba(229,72,77,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#05060C;--grid:rgba(150,160,255,.045);
  --au1:rgba(79,70,229,.55);--au2:rgba(147,51,234,.40);--au3:rgba(6,182,212,.30);--au4:rgba(67,56,202,.34);
  --solid:#14152B;--hair:rgba(170,180,255,.11);--hair2:rgba(170,180,255,.22);
  --depth:0 18px 44px -26px rgba(0,0,0,.95);
  --ink:#ECEBFA;--ink2:#C3C1DD;--ink3:#9593B5;--hover:rgba(150,140,255,.08);--well:rgba(170,180,255,.05);
  --accent:#8E7BFF;--accent-ink:#B8ADFF;--accent-bg:rgba(142,123,255,.14);--accent-line:rgba(142,123,255,.5);--glow:rgba(142,123,255,.45);--on-accent:#14152B;
  --qa:#FF6369;--qb:#3DD68C;--qc:#FFD84D;--qd:#A3AAC6;
  --danger:#FF6369;--danger-ink:#FF8A8F;--danger-bg:rgba(255,99,105,.10);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05060C;--grid:rgba(150,160,255,.045);
  --au1:rgba(79,70,229,.55);--au2:rgba(147,51,234,.40);--au3:rgba(6,182,212,.30);--au4:rgba(67,56,202,.34);
  --solid:#14152B;--hair:rgba(170,180,255,.11);--hair2:rgba(170,180,255,.22);
  --depth:0 18px 44px -26px rgba(0,0,0,.95);
  --ink:#ECEBFA;--ink2:#C3C1DD;--ink3:#9593B5;--hover:rgba(150,140,255,.08);--well:rgba(170,180,255,.05);
  --accent:#8E7BFF;--accent-ink:#B8ADFF;--accent-bg:rgba(142,123,255,.14);--accent-line:rgba(142,123,255,.5);--glow:rgba(142,123,255,.45);--on-accent:#14152B;
  --qa:#FF6369;--qb:#3DD68C;--qc:#FFD84D;--qd:#A3AAC6;
  --danger:#FF6369;--danger-ink:#FF8A8F;--danger-bg:rgba(255,99,105,.10);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;position:relative;isolation:isolate;overflow-x:hidden}
/* the aurora: diagonal bands, as on the board */
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:linear-gradient(112deg,transparent 18%,var(--au1) 30%,transparent 44%),linear-gradient(98deg,transparent 40%,var(--au2) 52%,transparent 64%),
    linear-gradient(120deg,transparent 58%,var(--au3) 70%,transparent 82%),radial-gradient(60vmax 30vmax at 50% 0%,var(--au4),transparent 70%);
  filter:blur(28px) saturate(1.2)}
.wrap{width:min(440px,100%);display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--ui);letter-spacing:.01em;color:var(--ink2)}
.brand svg{width:22px;height:22px;flex:none}
/* the instrument panel with the board's corner brackets in the four quadrant colours */
.panel{position:relative;display:grid;gap:10px;padding:30px 30px 26px;background:var(--solid);border:1px solid var(--hair2);border-radius:var(--r-xl);box-shadow:var(--depth),0 40px 90px -40px var(--glow)}
.panel::before{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
    linear-gradient(var(--qb),var(--qb)) left top/14px 2px no-repeat,linear-gradient(var(--qb),var(--qb)) left top/2px 14px no-repeat,
    linear-gradient(var(--qa),var(--qa)) right top/14px 2px no-repeat,linear-gradient(var(--qa),var(--qa)) right top/2px 14px no-repeat,
    linear-gradient(var(--qd),var(--qd)) left bottom/14px 2px no-repeat,linear-gradient(var(--qd),var(--qd)) left bottom/2px 14px no-repeat,
    linear-gradient(var(--qc),var(--qc)) right bottom/14px 2px no-repeat,linear-gradient(var(--qc),var(--qc)) right bottom/2px 14px no-repeat}
h1{margin:0;font:500 30px/1.1 var(--serif);letter-spacing:-.005em}
p{margin:0;color:var(--ink2);max-width:60ch}
.fine{font-size:13px;color:var(--ink3)}
.msg{padding:8px 10px;border-left:3px solid var(--danger);background:var(--danger-bg);color:var(--danger-ink);font:600 13px/1.4 var(--font)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 16px;border-radius:var(--r);font:600 15px var(--ui);letter-spacing:.01em;text-decoration:none;cursor:pointer}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.google{margin-top:8px;background:var(--solid);border:1px solid var(--hair2);color:var(--ink)}
.google:hover{border-color:var(--accent-line);background:var(--hover)}
.google:disabled{opacity:.55;cursor:not-allowed}
.google svg{width:18px;height:18px;flex:none}
.primary{margin-top:8px;border:0;background:var(--accent);color:var(--on-accent)}
.primary:hover{filter:brightness(1.08)}
.quiet{justify-self:start;min-height:36px;padding:0 2px;border:0;background:transparent;color:var(--accent-ink);font-weight:500}
.quiet:hover{text-decoration:underline;text-underline-offset:3px}
/* the readout: what was recorded, set like the board's instrument labels */
dl{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border-top:1px solid var(--hair)}
dl > div{display:contents}
dt,dd{margin:0;padding:8px 0;border-bottom:1px solid var(--hair)}
dt{padding-right:18px;font:500 13px/1.5 var(--ui);letter-spacing:.01em;color:var(--ink3)}
dd{font:500 14px/1.5 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dd .dot{display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:1px;background:var(--accent)}
/* sending: a scan line across the panel's top edge */
.scan{height:2px;margin:4px 0 2px;background:var(--hair);overflow:hidden}
.scan::after{content:"";display:block;width:34%;height:100%;background:var(--accent);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-10%)}to{transform:translateX(205%)}}
/* the coffee break: a cup plotted on chart paper, its steam drawn as rising traces */
.coffee{display:block;width:100%;height:auto;margin:-6px 0 4px;color:var(--ink)}
.coffee .gl{stroke:var(--hair);stroke-width:1}
.coffee .ax{stroke:var(--ink3);stroke-width:1.2;fill:none;stroke-linecap:round}
.coffee .tk{stroke:var(--ink3);stroke-width:1}
.coffee .cup{fill:var(--solid);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.coffee .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coffee .brew{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.coffee .st{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:26 8;animation:steam 2.8s linear infinite}
.coffee .st.s2{animation-delay:-.9s;opacity:.75}
.coffee .st.s3{animation-delay:-1.7s;opacity:.55}
@keyframes steam{to{stroke-dashoffset:68}}
@media (prefers-reduced-motion:reduce){.coffee .st,.scan::after{animation:none}}
@media (max-width:480px){.panel{padding:26px 20px 22px}h1{font-size:27px}.google,.primary{min-height:48px}}
</style>
<script src="config/tasksdashboard.config.js"></script>
<script>
(() => {
  'use strict';
  try { const t = localStorage.getItem('td.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}

  // this tab only: the PKCE verifier while Google is open, then the session (never the board's td.auth)
  const PKCE_KEY = 'td.request.pkce', AUTH_KEY = 'td.request.auth';
  const ss = {
    get: k => { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: k => { try { sessionStorage.removeItem(k); } catch (e) {} },
  };
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // the public config, checked as the board checks it: an https origin and a publishable key, nothing else is read
  function readConfig(raw) {
    if (!isObj(raw)) return null;
    const url = typeof raw.supabaseUrl === 'string' ? raw.supabaseUrl.trim().replace(/\/+$/, '') : '';
    const key = typeof raw.publishableKey === 'string' ? raw.publishableKey.trim() : '';
    return /^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(url) && /^sb_publishable_/.test(key) ? { supabaseUrl: url, publishableKey: key } : null;
  }
  const CFG = readConfig(window.TD_CONFIG);

  // ---- Google sign-in: PKCE against Supabase Auth, the minimum of TasksDashboard.html's T8 code ----
  const isHostedOrigin = o => /^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(String(o || '')) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(String(o || ''));
  const HOSTED = isHostedOrigin(location.origin);
  function b64url(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function pkceChallenge(verifier) {
    return b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  }
  // back to /request (Pages serves request.html there); the address loses the code at once
  const backUrl = () => location.origin + location.pathname.replace(/\.html$/, '');
  const CALLBACK_KEYS = ['code', 'error', 'error_code', 'error_description', 'state', 'access_token', 'refresh_token', 'expires_in', 'expires_at', 'token_type', 'provider_token', 'provider_refresh_token', 'type'];
  function readCallback(href) {
    let u;
    try { u = new URL(href); } catch (e) { return null; }
    const q = u.searchParams, h = new URLSearchParams(u.hash.replace(/^#/, ''));
    const get = k => q.get(k) || h.get(k) || '';
    const code = q.get('code') || '', error = get('error'), errorCode = get('error_code'), description = get('error_description').slice(0, 300);
    if (!code && !error && !errorCode && !h.get('access_token')) return null;
    CALLBACK_KEYS.forEach(k => { q.delete(k); h.delete(k); });
    const qs = q.toString(), hs = h.toString();
    return { code: error || errorCode ? '' : code, error, errorCode, description, cleanUrl: u.pathname + (qs ? '?' + qs : '') + (hs ? '#' + hs : '') };
  }
  // a refused sign-in in plain words; full = the sign-up hook's user cap (db/010)
  function oauthMessage(e) {
    const o = isObj(e) ? e : {};
    const code = String(o.errorCode || o.error_code || ''), err = String(o.error || ''), d = String(o.description || o.error_description || o.msg || o.message || '');
    if (/full right now/i.test(d)) return { full: true, text: 'TasksDashboard is full right now. Try again later.' };
    if (/^(flow_state_not_found|flow_state_expired|bad_code_verifier|bad_oauth_state|bad_oauth_callback)$/.test(code) || /flow state|code verifier/i.test(d)) return { text: 'The Google sign-in expired. Try again.' };
    if (err === 'access_denied' && (!d || /cancel|denied by the user/i.test(d))) return { text: 'Google sign-in was cancelled.' };
    return { text: 'Google sign-in failed' + (d ? ': ' + d.slice(0, 200).replace(/[.!?]*$/, '.') : '.') };
  }
  function sessionFromGrant(g) {
    if (!isObj(g) || !g.access_token || !g.refresh_token) return null;
    const exp = typeof g.expires_at === 'number' ? g.expires_at * 1000 : Date.now() + (Number(g.expires_in) || 3600) * 1000;
    return { access_token: g.access_token, refresh_token: g.refresh_token, expires_at: exp, email: (g.user && g.user.email) || '' };
  }

  async function call(path, body, token) {
    let r;
    const h = { apikey: CFG.publishableKey, 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    try { r = await fetch(CFG.supabaseUrl + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) }); }
    catch (e) { return { status: 0, json: null }; }
    let json = null;
    try { const t = await r.text(); json = t ? JSON.parse(t) : null; } catch (e) {}
    return { status: r.status, json };
  }
  let session = null;
  async function refresh() {
    const r = await call('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
    const s = r.status === 200 && sessionFromGrant(r.json);
    if (!s) return false;
    session = Object.assign(s, { email: s.email || session.email });
    ss.set(AUTH_KEY, session);
    return true;
  }
  // POST rpc/<name>; a stale token is refreshed once. Returns { ok, data } or { ok: false, status, code, message }
  async function rpc(name) {
    if (session.expires_at - 60000 <= Date.now() && !(await refresh())) return { ok: false, status: 401, code: 'session' };
    let r = await call('/rest/v1/rpc/' + name, {}, session.access_token);
    if (r.status === 401 && (await refresh())) r = await call('/rest/v1/rpc/' + name, {}, session.access_token);
    if (r.status >= 200 && r.status < 300) return { ok: true, data: r.json };
    const b = isObj(r.json) ? r.json : {};
    return { ok: false, status: r.status, code: String(b.code || ''), message: String(b.message || '') };
  }
  // my_access_request may answer a row, a one-row array or nothing
  const rowOf = d => (Array.isArray(d) ? d[0] : d) || null;

  // ---- views ----
  const main = () => document.getElementById('app');
  const GOOGLE_G = '<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
  const COFFEE = '<svg class="coffee" viewBox="0 0 240 132" role="img" aria-labelledby="cf-t"><title id="cf-t">A cup of coffee, steaming</title>' +
    '<defs><pattern id="cf-g" width="12" height="12" patternUnits="userSpaceOnUse"><path class="gl" d="M12 0H0V12" fill="none"/></pattern></defs>' +
    '<rect x="20" y="4" width="212" height="116" fill="url(#cf-g)"/>' +
    '<path class="tk" d="M16 28h4M16 52h4M16 76h4M16 100h4"/><path class="ax" d="M20 4V120H232"/>' +
    '<path class="st s1" d="M106 68c-9-9 9-15 0-24s9-15 0-24"/><path class="st s2" d="M122 66c-9-9 9-15 0-24s9-15 0-24"/><path class="st s3" d="M138 68c-9-9 9-15 0-24s9-15 0-24"/>' +
    '<path class="line" d="M154 84h7a9 9 0 0 1 9 9v1a9 9 0 0 1-9 9h-9"/>' +
    '<path class="cup" d="M90 76h64v22a16 16 0 0 1-16 16h-32a16 16 0 0 1-16-16z"/><path class="brew" d="M95 82h54"/>' +
    '<path class="line" d="M70 118h104"/><path class="line" d="M84 124h76" style="stroke-width:1.4"/></svg>';
  const when = t => {
    const d = new Date(t);
    if (!t || isNaN(d)) return '';
    const p = n => String(n).padStart(2, '0');
    return `<time datetime="${esc(d.toISOString())}">${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}</time>`;
  };
  const account = () => session && session.email ? `<div><dt>Account</dt><dd>${esc(session.email)}</dd></div>` : '';
  const signOutBtn = '<button type="button" class="quiet" data-act="signout">Use another account</button>';

  function view(state, o = {}) {
    const m = main();
    m.dataset.state = state;
    let h = '';
    if (state === 'signedout') {
      h = '<h1>Ask for access</h1><p>TasksDashboard is a private board. Sign in with Google and your request goes to the people who run it.</p>' +
        (o.message ? `<p class="msg" role="alert">${esc(o.message)}</p>` : '') +
        `<button type="button" class="google" data-act="google"${HOSTED && CFG ? '' : ' disabled'}>${GOOGLE_G}<span>Continue with Google</span></button>` +
        (HOSTED ? '' : '<p class="fine">Open this page on its https address to sign in.</p>') +
        '<p class="fine">We keep your email, your name and the time of the request. We also use your email address to send you one email with the decision (approved or not), from Maksym\'s Gmail.</p>';
    } else if (state === 'sending') {
      h = '<h1>Sending your request</h1><div class="scan" aria-hidden="true"></div><p>One moment.</p>';
    } else if (state === 'sent') {
      h = COFFEE + '<h1>Request sent</h1><p>Your request is sent. We\'ll let you in soon.</p>' +
        `<dl><div><dt>Requested</dt><dd>${when(o.row.requested_at) || 'just now'}</dd></div>${account()}<div><dt>Status</dt><dd><span class="dot" aria-hidden="true"></span>Waiting for a decision</dd></div></dl>` +
        '<p class="fine">Come back to this page later to see the answer.</p>' + signOutBtn;
    } else if (state === 'approved') {
      h = '<h1>You\'re in</h1><p>Your request was approved. Open the board and sign in with the same Google account.</p>' +
        `<dl>${account()}${o.row.decided_at ? `<div><dt>Approved</dt><dd>${when(o.row.decided_at)}</dd></div>` : ''}</dl>` +
        `<a class="btn primary" href="${HOSTED ? '/' : 'TasksDashboard.html'}" data-act="open">Open TasksDashboard</a>` + signOutBtn;
    } else if (state === 'declined') {
      h = '<h1>Request declined</h1><p>The people who run this board declined the request. If you think that\'s a mistake, ask the person who sent you the link.</p>' +
        `<dl>${account()}${o.row.decided_at ? `<div><dt>Declined</dt><dd>${when(o.row.decided_at)}</dd></div>` : ''}</dl>` + signOutBtn;
    } else if (state === 'cap') {
      h = '<h1>Try again later</h1>' + `<p>${esc(o.message || 'Too many requests are waiting right now. Try again tomorrow.')}</p>` + (session ? signOutBtn : '');
    } else {
      h = '<h1>Something went wrong</h1>' + `<p class="msg" role="alert">${esc(o.message || 'The request did not go through.')}</p>` +
        '<button type="button" class="primary" data-act="retry">Try again</button>' + (session ? signOutBtn : '');
    }
    m.innerHTML = h;
  }

  // ---- flow ----
  function failed(r) {
    if (r.code === '54000') return view('cap');
    // db/015: a household member has the board already
    if (r.code === '22023' && /already have access/i.test(r.message)) return view('approved', { row: {} });
    if (r.status === 401 || r.code === 'session' || r.code === 'PGRST301' || r.code === 'PGRST303') { forget(); return view('signedout', { message: 'Session ended. Sign in again.' }); }
    if (!r.status) return view('error', { message: 'Can\'t reach the server. Check the connection and try again.' });
    if (r.status === 429) return view('error', { message: 'Too many attempts. Wait a minute, then try again.' });
    return view('error', { message: 'The request did not go through' + (r.message ? ': ' + r.message.slice(0, 160).replace(/[.!?]*$/, '.') : '.') });
  }
  function show(row) {
    const st = String(row.status || 'pending');
    view(st === 'approved' || st === 'declined' ? st : 'sent', { row });
  }
  // the state first; a request is made only when this account has none (or only a removed one)
  async function check() {
    view('sending');
    let r = await rpc('my_access_request');
    if (!r.ok) return failed(r);
    let row = rowOf(r.data);
    if (!row || row.status === 'removed') {
      const q = await rpc('request_access');
      if (!q.ok) return failed(q);
      r = await rpc('my_access_request');
      if (!r.ok) return failed(r);
      row = rowOf(r.data) || (isObj(rowOf(q.data)) ? rowOf(q.data) : null) || { status: 'pending' };
    }
    show(row);
  }
  function forget() { session = null; ss.del(AUTH_KEY); }
  async function signOut() {
    const token = session && session.access_token;
    forget();
    view('signedout');
    if (token) await call('/auth/v1/logout?scope=local', null, token);
  }
  async function startGoogle() {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = await pkceChallenge(verifier);
    ss.set(PKCE_KEY, { verifier });
    const p = new URLSearchParams({ provider: 'google', redirect_to: backUrl(), code_challenge: challenge, code_challenge_method: 's256', prompt: 'select_account' });
    location.assign(CFG.supabaseUrl + '/auth/v1/authorize?' + p.toString());
  }
  async function finishGoogle(cb) {
    history.replaceState(null, '', cb.cleanUrl);
    const saved = ss.get(PKCE_KEY);
    ss.del(PKCE_KEY);
    if (!cb.code) { const m = oauthMessage(cb); return m.full ? view('cap', { message: m.text }) : view('signedout', { message: m.text }); }
    if (!isObj(saved) || typeof saved.verifier !== 'string') return view('signedout', { message: 'The Google sign-in expired. Try again.' });
    view('sending');
    const r = await call('/auth/v1/token?grant_type=pkce', { auth_code: cb.code, code_verifier: saved.verifier });
    const s = r.status === 200 && sessionFromGrant(r.json);
    if (!s) {
      if (!r.status || r.status >= 500) return view('error', { message: 'Can\'t reach the server. Check the connection and try again.' });
      const m = oauthMessage(r.json);
      return m.full ? view('cap', { message: m.text }) : view('signedout', { message: m.text });
    }
    session = s;
    ss.set(AUTH_KEY, session);
    await check();
  }

  function start() {
    main().addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'google') { b.disabled = true; startGoogle().catch(() => { b.disabled = false; view('signedout', { message: 'Google sign-in failed. Try again.' }); }); }
      else if (act === 'signout') signOut();
      else if (act === 'retry') session ? check() : view('signedout');
    });
    if (!CFG) return view('error', { message: 'This page has no valid config (config/tasksdashboard.config.js).' });
    const cb = readCallback(location.href);
    if (cb) return finishGoogle(cb);
    const saved = ss.get(AUTH_KEY);
    if (isObj(saved) && typeof saved.refresh_token === 'string' && typeof saved.access_token === 'string') { session = saved; return check(); }
    view('signedout');
  }
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', start) : start();
})();
</script>
